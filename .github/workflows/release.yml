name: Release
"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布版本标签，必须与 package.json 一致，例如 v1.6.1
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-desktop
  cancel-in-progress: false
jobs:
  prepare:
    name: Validate release version and signing credentials
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify requested release matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected." >&2
            exit 1
          fi
          test "$(head -n 1 docs/records/release-notes.md)" = "# Artemis $RELEASE_TAG"
      - name: Check signing credentials
        run: node apps/desktop/scripts/release/validate-release-env.mjs mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: Artemis
    if: github.ref == 'refs/heads/main'
  ci:
    name: Release CI
    needs: prepare
    uses: ./.github/workflows/ci.yml
  sign-macos:
    name: Build and sign macOS arm64
    needs:
      - prepare
      - ci
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Build UI library dependencies for bundled plugin verification
        run: npm run build:ui-libraries
      - name: Package and sign macOS arm64 DMG and ZIP
        run: |
          node apps/desktop/scripts/release/validate-release-env.mjs mac
          npm run sign:mac:arm64 -w @artemis/desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: Artemis
      - name: Archive signed app and native verification modules
        run: >-
          tar -czf signed-macos-arm64.tar.gz apps/desktop/release/mac-arm64 packages/platform/dist
          packages/protocol/dist packages/plugin-contract/dist
      - name: Preserve signed app for notarization
        uses: actions/upload-artifact@v6
        with:
          name: signed-macos-arm64
          path: signed-macos-arm64.tar.gz
          retention-days: 1
          if-no-files-found: error
  package-macos:
    name: Notarize and verify macOS arm64
    needs: sign-macos
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: signed-macos-arm64
          path: signed-input
      - name: Restore signed app without rebuilding or signing
        run: tar -xzf signed-input/signed-macos-arm64.tar.gz
      - name: Notarize signed app and rebuild stapled archives
        run: npm run notarize:mac:arm64 -w @artemis/desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: Artemis
      - name: Verify signature, notarization, native PTY, Seatbelt and rollback
        run: npm run verify:mac-native -w @artemis/desktop
      - name: Verify final DMG and ZIP applications
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version="$(node -p "require('./package.json').version")"
          dmg="$PWD/apps/desktop/release/Artemis-macOS-arm64-$version.dmg"
          zip="$PWD/apps/desktop/release/Artemis-macOS-arm64-$version.zip"
          verification_root="$(mktemp -d "$RUNNER_TEMP/artemis-release-verify.XXXXXX")"
          mount_path="$verification_root/dmg"
          cleanup() {
            /usr/bin/hdiutil detach "$mount_path" >/dev/null 2>&1 || true
            rm -rf "$verification_root"
          }
          trap cleanup EXIT
          verify_app() {
            local app="$1"
            /usr/bin/codesign --verify --deep --strict "$app"
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$app"
            /usr/bin/xcrun stapler validate "$app"
            test "$(/usr/bin/lipo -archs "$app/Contents/MacOS/Artemis")" = arm64
          }
          /usr/bin/hdiutil verify "$dmg"
          /usr/bin/unzip -t "$zip"
          /usr/bin/unzip -q "$zip" -d "$verification_root/zip"
          verify_app "$verification_root/zip/Artemis.app"
          mkdir "$mount_path"
          /usr/bin/hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "$dmg"
          verify_app "$mount_path/Artemis.app"
      - uses: actions/upload-artifact@v6
        with:
          name: release-macos-arm64
          path: |-
            apps/desktop/release/Artemis-macOS-arm64-*
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/release-manifest.json
          retention-days: 7
          if-no-files-found: error
  package-windows:
    name: Package and verify Windows x64 NSIS and ZIP
    needs:
      - prepare
      - ci
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Normalize reused Windows checkout to LF
        run: node scripts/ci/normalize-windows-checkout.mjs
      - name: Verify native runner architecture
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - run: npm ci
      - name: Build UI library dependencies for bundled plugin verification
        run: npm run build:ui-libraries
      - name: Build and verify Windows installer and ZIP
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'artemis-windows-release.log'
          npm run release:win -w @artemis/desktop 2>&1 | Tee-Object -FilePath $logPath
          $releaseExitCode = $LASTEXITCODE
          if ($releaseExitCode -ne 0) {
            $tail = (Get-Content $logPath -Tail 20 | ForEach-Object {
              $line = $_
              if ($env:GITHUB_TOKEN) { $line = $line.Replace($env:GITHUB_TOKEN, '***') }
              if ($line.Length -gt 160) { $line.Substring(0, 160) + '...' } else { $line }
            }) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows release failure::$message"
          }
          exit $releaseExitCode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTEMIS_REQUIRE_SIGNATURE: "0"
          ARTEMIS_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.ARTEMIS_UPDATE_ED25519_PRIVATE_KEY }}
          ARTEMIS_UPDATE_KEY_ID: release-2026-01
          ARTEMIS_UPDATE_SEQUENCE: ${{ github.run_number }}
      - name: Verify NSIS installed Unicode path and Design sandbox
        working-directory: apps/desktop
        run: node scripts/verify/native/verify-windows-installed.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows-x64
          path: |-
            apps/desktop/release/Artemis-Windows-x64-*.exe
            apps/desktop/release/Artemis-Windows-x64-*.zip
            apps/desktop/release/windows-x64-update.json
            apps/desktop/release/release-manifest.json
          retention-days: 7
          if-no-files-found: error
  publish:
    name: Publish client artifacts to Artemis
    needs:
      - package-macos
      - package-windows
    permissions:
      contents: write
      actions: read
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-inputs
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install release verification dependencies
        run: npm ci --ignore-scripts
      - name: Verify and collect selected platform release sets
        shell: bash
        env: {}
        run: |
          args=(release-inputs release-assets)
          node scripts/release/collect-release-assets.mjs "${args[@]}"
      - name: Publish verified client packages
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: >
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep 5
            done
            return 1
          }

          cp docs/records/release-notes.md "$RUNNER_TEMP/artemis-release-notes.md"

          printf '\nSource commit / 源码提交：`%s`.\n' "$RELEASE_SHA" >> "$RUNNER_TEMP/artemis-release-notes.md"

          target_repo=EurekaRaider/Artemis

          existing="$(retry gh release view "$RELEASE_TAG" --repo "$target_repo" --json isDraft --jq .isDraft
          2>/dev/null || true)"

          if [[ -z "$existing" ]]; then
            retry gh release create "$RELEASE_TAG" --repo "$target_repo" --title "Artemis $RELEASE_TAG" --target "$RELEASE_SHA" --draft --notes-file "$RUNNER_TEMP/artemis-release-notes.md"
          elif [[ "$existing" != true ]]; then
            echo "Refusing to overwrite an existing public release." >&2
            exit 1
          fi

          # Only the validated allowlist is uploaded; never upload intermediate signing material.

          node scripts/slack/verify-slack-cli.mjs

          node --input-type=module <<'NODE'

          import { execFileSync } from 'node:child_process';

          import { createHash } from 'node:crypto';

          import { readFileSync, readdirSync } from 'node:fs';

          import { setTimeout } from 'node:timers/promises';

          const repository = 'EurekaRaider/Artemis';

          const tag = process.env.RELEASE_TAG;

          const gh = (...args) => execFileSync('gh', args, {
            encoding: 'utf8',
            maxBuffer: 8 * 1024 * 1024,
            stdio: ['ignore', 'pipe', 'inherit'],
            env: { ...process.env, GODEBUG: 'http2client=0' },
          }).trim();

          async function api(path) {
            for (let attempt = 0; ; attempt++) {
              try { return JSON.parse(gh('api', `repos/${repository}/${path}`)); }
              catch (error) {
                if (attempt === 2) throw error;
                await setTimeout(5000);
              }
            }
          }

          const release = (await api('releases?per_page=100')).find(item => item.tag_name === tag);

          if (!release?.draft) throw new Error('Expected the existing release draft.');

          for (const name of readdirSync('release-assets').sort()) {
            const path = `release-assets/${name}`;
            const bytes = readFileSync(path);
            const digest = `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
            for (let attempt = 0; ; attempt++) {
              let asset = (await api(`releases/${release.id}/assets?per_page=100`)).find(item => item.name === name);
              if (asset?.state === 'starter' && !asset.digest) {
                try { gh('api', '--method', 'DELETE', `repos/${repository}/releases/assets/${asset.id}`); }
                catch (error) {
                  if (attempt === 3) throw error;
                  await setTimeout(5000);
                  continue;
                }
                asset = undefined;
              }
              if (asset) {
                if (asset.state !== 'uploaded' || asset.size !== bytes.length || asset.digest !== digest)
                  throw new Error(`Refusing to replace different existing asset: ${name}`);
                console.log(`Verified existing upload: ${name}`);
                break;
              }
              if (attempt === 3) throw new Error(`Upload not confirmed after three attempts: ${name}`);
              try { gh('release', 'upload', tag, path, '--repo', repository); }
              catch (error) { console.error(`Upload attempt ${attempt + 1} failed for ${name}: ${error.message}`); }
              await setTimeout(5000);
            }
          }

          NODE

          retry gh release view "$RELEASE_TAG" --repo "$target_repo" --json assets --jq '.assets[].name' | sort >
          "$RUNNER_TEMP/artemis-uploaded-assets.txt"

          (cd release-assets && printf '%s\n' *) | sort > "$RUNNER_TEMP/artemis-expected-assets.txt"

          diff -u "$RUNNER_TEMP/artemis-expected-assets.txt" "$RUNNER_TEMP/artemis-uploaded-assets.txt"

          retry gh release edit "$RELEASE_TAG" --repo "$target_repo" --notes-file
          "$RUNNER_TEMP/artemis-release-notes.md" --draft=false
      - name: Advance signed Windows platform channel and verify readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish-windows-update-channel.mjs release-assets
