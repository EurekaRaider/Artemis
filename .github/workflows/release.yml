name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本标签，必须与 package.json 一致，例如 v1.6.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos-arm64
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version and credentials
    if: github.event.repository.private
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Verify requested release matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected." >&2
            exit 1
          fi

      - name: Check signing credentials and release repository access
        run: |
          node apps/desktop/scripts/validate-release-env.mjs mac
          if [[ -z "$GH_TOKEN" ]]; then
            echo "ARTEMIS_RELEASE_TOKEN is required to publish to ArtemisRelease." >&2
            exit 1
          fi
          gh api repos/EurekaRaider/ArtemisRelease --silent
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: ArtemisRelease
          GH_TOKEN: ${{ secrets.ARTEMIS_RELEASE_TOKEN }}

  ci:
    name: Release CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  package-macos:
    name: Sign and notarize macOS arm64
    needs: ci
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package signed and notarized macOS arm64 DMG and ZIP
        run: |
          node apps/desktop/scripts/validate-release-env.mjs mac
          npm run package:mac:arm64 -w @artemis/desktop -- --release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: ArtemisRelease

      - name: Verify signature, notarization, native PTY, Seatbelt and rollback
        run: npm run verify:mac-native -w @artemis/desktop

      - name: Verify final DMG and ZIP applications
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version="$(node -p "require('./package.json').version")"
          dmg="$PWD/apps/desktop/release/Artemis-macOS-arm64-$version.dmg"
          zip="$PWD/apps/desktop/release/Artemis-macOS-arm64-$version.zip"
          verification_root="$(mktemp -d "$RUNNER_TEMP/artemis-release-verify.XXXXXX")"
          mount_path="$verification_root/dmg"
          cleanup() {
            /usr/bin/hdiutil detach "$mount_path" >/dev/null 2>&1 || true
            rm -rf "$verification_root"
          }
          trap cleanup EXIT
          verify_app() {
            local app="$1"
            /usr/bin/codesign --verify --deep --strict "$app"
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$app"
            /usr/bin/xcrun stapler validate "$app"
            test "$(/usr/bin/lipo -archs "$app/Contents/MacOS/Artemis")" = arm64
          }
          /usr/bin/hdiutil verify "$dmg"
          /usr/bin/unzip -t "$zip"
          /usr/bin/unzip -q "$zip" -d "$verification_root/zip"
          verify_app "$verification_root/zip/Artemis.app"
          mkdir "$mount_path"
          /usr/bin/hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "$dmg"
          verify_app "$mount_path/Artemis.app"

      - name: Upload verified macOS arm64 release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            apps/desktop/release/Artemis-macOS-arm64-*.dmg
            apps/desktop/release/Artemis-macOS-arm64-*.zip
            apps/desktop/release/Artemis-macOS-arm64-*.blockmap
            apps/desktop/release/*-mac.yml
            apps/desktop/release/release-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish to ArtemisRelease
    needs: package-macos
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-macos-arm64
          path: release-assets

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Verify complete macOS arm64 release set
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "release-assets/Artemis-macOS-arm64-$version.dmg"
          test -f "release-assets/Artemis-macOS-arm64-$version.zip"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('release-assets/release-manifest.json', 'utf8'));
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (manifest.version !== version) throw new Error('Release manifest version mismatch');
          if (!manifest.artifacts.some(({ name }) => /^(latest|alpha|beta)-mac\.yml$/.test(name))) {
            throw new Error('macOS update metadata is missing');
          }
          const expected = new Set(['release-manifest.json']);
          for (const artifact of manifest.artifacts) {
            if (!/^(Artemis-macOS-arm64-[^/]+\.(dmg|zip|blockmap)|(latest|alpha|beta)-mac\.yml)$/.test(artifact.name)) {
              throw new Error('Unexpected release artifact');
            }
            const bytes = readFileSync(`release-assets/${artifact.name}`);
            if (bytes.length !== artifact.size || createHash('sha256').update(bytes).digest('hex') !== artifact.sha256) {
              throw new Error(`Release artifact integrity failed: ${artifact.name}`);
            }
            expected.add(artifact.name);
          }
          if (readdirSync('release-assets').some(name => !expected.has(name))) {
            throw new Error('Unlisted release artifact');
          }
          NODE

      - name: Publish release and macOS arm64 packages
        env:
          GH_TOKEN: ${{ secrets.ARTEMIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/artemis-release-notes.md" <<EOF
          macOS Apple Silicon（arm64）版本。

          应用已通过 Developer ID 签名、Apple 公证及最终 DMG/ZIP 内应用校验。

          源码版本：\`$GITHUB_SHA\`。
          EOF
          node scripts/verify-slack-cli.mjs
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo EurekaRaider/ArtemisRelease \
            --target main \
            --title "Artemis $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/artemis-release-notes.md"
