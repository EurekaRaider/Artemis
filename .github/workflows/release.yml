name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本标签，必须与 package.json 一致，例如 v1.6.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version and signing credentials
    if: github.event.repository.private
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Verify requested release matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected." >&2
            exit 1
          fi

      - name: Check signing credentials
        run: node apps/desktop/scripts/validate-release-env.mjs mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: ArtemisRelease

  ci:
    name: Release CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  sign-macos:
    name: Build and sign macOS arm64
    needs: ci
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package and sign macOS arm64 DMG and ZIP
        run: |
          node apps/desktop/scripts/validate-release-env.mjs mac
          npm run sign:mac:arm64 -w @artemis/desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: ArtemisRelease

      # electron-builder 26.16.1 retries osx-sign three times (5/10/15 seconds).
      - name: Archive signed app and native verification modules
        run: tar -czf signed-macos-arm64.tar.gz apps/desktop/release/mac-arm64 packages/platform/dist packages/protocol/dist

      - name: Preserve signed app for independent notarization retries
        uses: actions/upload-artifact@v7
        with:
          name: signed-macos-arm64
          path: signed-macos-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-macos:
    name: Notarize and verify macOS arm64
    needs: sign-macos
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: signed-macos-arm64
          path: signed-input
      - name: Restore signed app without rebuilding or signing
        run: tar -xzf signed-input/signed-macos-arm64.tar.gz
      - name: Restore prior Apple submission from this workflow run
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' > "$RUNNER_TEMP/notarization-artifacts.txt"
          state_name="$( { grep '^notarization-state-macos-arm64-' "$RUNNER_TEMP/notarization-artifacts.txt" || true; } | sort -V | tail -1)"
          if [[ -n "$state_name" ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$state_name" --dir apps/desktop/release
          fi

      - name: Notarize signed app and rebuild stapled archives
        run: npm run notarize:mac:arm64 -w @artemis/desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: ArtemisRelease

      - name: Save notarization submission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notarization-state-macos-arm64-${{ github.run_attempt }}
          path: apps/desktop/release/notarization-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify signature, notarization, native PTY, Seatbelt and rollback
        run: npm run verify:mac-native -w @artemis/desktop

      - name: Verify final DMG and ZIP applications
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version="$(node -p "require('./package.json').version")"
          dmg="$PWD/apps/desktop/release/Artemis-macOS-arm64-$version.dmg"
          zip="$PWD/apps/desktop/release/Artemis-macOS-arm64-$version.zip"
          verification_root="$(mktemp -d "$RUNNER_TEMP/artemis-release-verify.XXXXXX")"
          mount_path="$verification_root/dmg"
          cleanup() {
            /usr/bin/hdiutil detach "$mount_path" >/dev/null 2>&1 || true
            rm -rf "$verification_root"
          }
          trap cleanup EXIT
          verify_app() {
            local app="$1"
            /usr/bin/codesign --verify --deep --strict "$app"
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$app"
            /usr/bin/xcrun stapler validate "$app"
            test "$(/usr/bin/lipo -archs "$app/Contents/MacOS/Artemis")" = arm64
          }
          /usr/bin/hdiutil verify "$dmg"
          /usr/bin/unzip -t "$zip"
          /usr/bin/unzip -q "$zip" -d "$verification_root/zip"
          verify_app "$verification_root/zip/Artemis.app"
          mkdir "$mount_path"
          /usr/bin/hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "$dmg"
          verify_app "$mount_path/Artemis.app"

      - name: Upload verified macOS arm64 release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            apps/desktop/release/Artemis-macOS-arm64-*.dmg
            apps/desktop/release/Artemis-macOS-arm64-*.zip
            apps/desktop/release/Artemis-macOS-arm64-*.blockmap
            apps/desktop/release/*-mac.yml
            apps/desktop/release/release-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-windows:
    name: Package and verify Windows x64 ZIP
    needs: ci
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Verify native runner architecture
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - run: npm ci
      - name: Build and verify unsigned Windows ZIP
        run: npm run release:win -w @artemis/desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTEMIS_REQUIRE_SIGNATURE: "0"
      - name: Upload verified Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            apps/desktop/release/Artemis-Windows-x64-*.zip
            apps/desktop/release/release-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish to private Artemis Release
    needs: [package-macos, package-windows]
    permissions:
      contents: write
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-inputs

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install release verification dependencies
        run: npm ci --ignore-scripts

      - name: Verify and combine both platform release sets
        run: node scripts/collect-release-assets.mjs release-inputs release-assets

      - name: Publish verified macOS and Windows packages
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/artemis-release-notes.md" <<EOF
          macOS Apple Silicon（arm64）：Developer ID 签名、公证，支持应用内更新。
          Windows x64：无签名 ZIP，应用提示新版本后手动下载替换。

          Windows：将 ZIP 解压到新文件夹，退出旧版后再启动新版。保留用户数据，不要删除 %APPDATA% 中的 Artemis 文件夹。

          源码版本：\`$GITHUB_SHA\`。
          EOF
          node scripts/verify-slack-cli.mjs
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Artemis $RELEASE_TAG" \
            --draft \
            --notes-file "$RUNNER_TEMP/artemis-release-notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
