name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布版本标签，必须与 package.json 一致，例如 v1.6.1"
        required: true
        type: string
      release_sha:
        description: "沿用已通过 CI 的提交（或仅含发布流程修复的后续提交）；留空则运行本次发布 CI"
        required: false
        type: string
      ci_run_id:
        description: "release_sha 对应的成功 CI 运行 ID"
        required: false
        type: string
      reuse_signed_macos_run_id:
        description: "复用此发布运行中已签名的 macOS 应用，重新执行公证和验证"
        required: false
        type: string
      reuse_verified_macos_run_id:
        description: "复用此发布运行中已公证和验证的 macOS 最终产物"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release version and signing credentials
    if: github.event.repository.private
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0

      - name: Verify previous CI before reusing it
        if: inputs.release_sha != '' || inputs.ci_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CI_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          verified="$(gh run view "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json headSha,conclusion,workflowName \
            --jq '[.headSha, .conclusion, .workflowName] | join(" ")')"
          read -r ci_sha ci_conclusion ci_workflow <<< "$verified"
          test "$ci_conclusion $ci_workflow" = "success CI"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$ci_sha" "$RELEASE_SHA"
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/release.yml|apps/desktop/scripts/verify-packaged-source-privacy.mjs|apps/desktop/scripts/verify-macos-native.mjs) ;;
              *) echo "CI does not cover changed path: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$ci_sha" "$RELEASE_SHA")

      - name: Verify signed macOS application before reusing it
        if: inputs.reuse_signed_macos_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_RUN_ID: ${{ inputs.reuse_signed_macos_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$MACOS_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          verified="$(gh run view "$MACOS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json jobs --jq '[.jobs[] | select(.name == "Build and sign macOS arm64" and .conclusion == "success")] | length')"
          test "$verified" = 1
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq signed-macos-arm64.tar.gz <<< "$assets"

      - name: Verify completed macOS package before reusing it
        if: inputs.reuse_verified_macos_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_RUN_ID: ${{ inputs.reuse_verified_macos_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          [[ "$MACOS_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          verified="$(gh run view "$MACOS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json headSha,workflowName,jobs \
            --jq '[.headSha, .workflowName, ([.jobs[] | select(.name == "Notarize and verify macOS arm64" and .conclusion == "success")] | length)] | join(" ")')"
          read -r mac_sha workflow_name job_count <<< "$verified"
          test "$workflow_name $job_count" = "Release 1"
          git merge-base --is-ancestor "$mac_sha" "$RELEASE_SHA"
          while IFS= read -r changed; do
            test "$changed" = .github/workflows/release.yml || exit 1
          done < <(git diff --name-only "$mac_sha" "$RELEASE_SHA")

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Verify requested release matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected." >&2
            exit 1
          fi
          test "$(head -n 1 docs/records/release-notes.md)" = "# Artemis $RELEASE_TAG"

      - name: Check signing credentials
        run: node apps/desktop/scripts/validate-release-env.mjs mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: ArtemisRelease

  ci:
    name: Release CI
    needs: prepare
    if: inputs.release_sha == ''
    uses: ./.github/workflows/ci.yml

  stage-release:
    name: Open private draft Release
    needs: [prepare, ci]
    if: always() && needs.prepare.result == 'success' && (needs.ci.result == 'success' || (inputs.release_sha != '' && needs.ci.result == 'skipped'))
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    outputs:
      release-id: ${{ steps.metadata.outputs.release-id }}
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Create or resume draft for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish,isDraft \
            --jq '[.targetCommitish, (.isDraft | tostring)] | join(" ")' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$RELEASE_SHA true" ]]; then
              echo "Existing release must be a draft for this exact commit: $existing" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" --title "Artemis $RELEASE_TAG" \
              --draft --notes "Private staging release for $RELEASE_SHA."
          fi
      - name: Provide draft Release ID to Windows runner
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft and .target_commitish == \"$RELEASE_SHA\") | .id")"
          [[ "$release_id" =~ ^[0-9]+$ ]] || exit 1
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  sign-macos:
    name: Build and sign macOS arm64
    needs: stage-release
    if: always() && needs.stage-release.result == 'success' && inputs.reuse_signed_macos_run_id == ''
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Package and sign macOS arm64 DMG and ZIP
        run: |
          node apps/desktop/scripts/validate-release-env.mjs mac
          npm run sign:mac:arm64 -w @artemis/desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: ArtemisRelease

      # electron-builder 26.16.1 retries osx-sign three times (5/10/15 seconds).
      - name: Archive signed app and native verification modules
        run: tar -czf signed-macos-arm64.tar.gz apps/desktop/release/mac-arm64 packages/platform/dist packages/protocol/dist

      - name: Preserve signed app for independent notarization retries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" signed-macos-arm64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  package-macos:
    name: Notarize and verify macOS arm64
    needs: [stage-release, sign-macos]
    if: always() && needs.stage-release.result == 'success' && inputs.reuse_verified_macos_run_id == '' && (needs.sign-macos.result == 'success' || (inputs.reuse_signed_macos_run_id != '' && needs.sign-macos.result == 'skipped'))
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - name: Download signed application from private draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern signed-macos-arm64.tar.gz --dir signed-input
      - name: Restore signed app without rebuilding or signing
        run: tar -xzf signed-input/signed-macos-arm64.tar.gz
      - name: Restore prior Apple submission from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq notarization-mac-arm64.json; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern notarization-mac-arm64.json --dir apps/desktop/release
          fi

      - name: Notarize signed app and rebuild stapled archives
        run: npm run notarize:mac:arm64 -w @artemis/desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTEMIS_UPDATE_OWNER: EurekaRaider
          ARTEMIS_UPDATE_REPO: ArtemisRelease

      - name: Save notarization submission evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          state=apps/desktop/release/notarization-mac-arm64.json
          if [[ -f "$state" ]]; then
            gh release upload "$RELEASE_TAG" "$state" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Verify signature, notarization, native PTY, Seatbelt and rollback
        run: npm run verify:mac-native -w @artemis/desktop

      - name: Verify final DMG and ZIP applications
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version="$(node -p "require('./package.json').version")"
          dmg="$PWD/apps/desktop/release/Artemis-macOS-arm64-$version.dmg"
          zip="$PWD/apps/desktop/release/Artemis-macOS-arm64-$version.zip"
          verification_root="$(mktemp -d "$RUNNER_TEMP/artemis-release-verify.XXXXXX")"
          mount_path="$verification_root/dmg"
          cleanup() {
            /usr/bin/hdiutil detach "$mount_path" >/dev/null 2>&1 || true
            rm -rf "$verification_root"
          }
          trap cleanup EXIT
          verify_app() {
            local app="$1"
            /usr/bin/codesign --verify --deep --strict "$app"
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
            /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$app"
            /usr/bin/xcrun stapler validate "$app"
            test "$(/usr/bin/lipo -archs "$app/Contents/MacOS/Artemis")" = arm64
          }
          /usr/bin/hdiutil verify "$dmg"
          /usr/bin/unzip -t "$zip"
          /usr/bin/unzip -q "$zip" -d "$verification_root/zip"
          verify_app "$verification_root/zip/Artemis.app"
          mkdir "$mount_path"
          /usr/bin/hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "$dmg"
          verify_app "$mount_path/Artemis.app"

      - name: Upload verified macOS arm64 release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd apps/desktop/release
          cp release-manifest.json release-manifest-macos-arm64.json
          shopt -s nullglob
          assets=(Artemis-macOS-arm64-*.dmg Artemis-macOS-arm64-*.zip Artemis-macOS-arm64-*.blockmap *-mac.yml)
          gh release upload "$RELEASE_TAG" "${assets[@]}" release-manifest-macos-arm64.json --repo "$GITHUB_REPOSITORY" --clobber

  package-windows:
    name: Package and verify Windows x64 ZIP
    needs: stage-release
    if: always() && needs.stage-release.result == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Normalize reused Windows checkout to LF
        run: node scripts/normalize-windows-checkout.mjs
      - name: Verify native runner architecture
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - run: npm ci
      - name: Build and verify unsigned Windows ZIP
        run: npm run release:win -w @artemis/desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTEMIS_REQUIRE_SIGNATURE: "0"
      - name: Upload verified Windows ZIP directly to private draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          $zipPath = "apps/desktop/release/Artemis-Windows-x64-$version.zip"
          $manifestPath = 'apps/desktop/release/release-manifest-windows-x64.json'
          Copy-Item apps/desktop/release/release-manifest.json apps/desktop/release/release-manifest-windows-x64.json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repositoryUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          if ($env:RELEASE_ID -notmatch '^[0-9]+$') { throw 'Draft Release ID is missing' }
          $release = Invoke-RestMethod -Method Get -Uri "$repositoryUri/releases/$env:RELEASE_ID" -Headers $headers
          if ($release.tag_name -cne $env:RELEASE_TAG -or -not $release.draft -or $release.target_commitish -cne $env:RELEASE_SHA) {
            throw "Release draft does not target $env:RELEASE_SHA"
          }
          $uploadUrl = $release.upload_url -replace '\{.*$', ''
          foreach ($path in @($zipPath, $manifestPath)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing verified release asset: $path" }
            $name = Split-Path $path -Leaf
            foreach ($asset in @($release.assets)) {
              if ($asset.name -ceq $name) {
                Invoke-RestMethod -Method Delete -Uri "$repositoryUri/releases/assets/$($asset.id)" -Headers $headers
              }
            }
            $assetUri = "${uploadUrl}?name=$([System.Uri]::EscapeDataString($name))"
            $contentType = if ($name.EndsWith('.zip')) { 'application/zip' } else { 'application/json' }
            $uploaded = Invoke-RestMethod -Method Post -Uri $assetUri -Headers $headers -ContentType $contentType -InFile (Resolve-Path $path)
            if ($uploaded.name -cne $name -or $uploaded.size -ne (Get-Item $path).Length) {
              throw "Uploaded release asset does not match $path"
            }
          }

  publish:
    name: Publish client artifacts to ArtemisRelease
    needs: [package-macos, package-windows]
    if: always() && (needs.package-macos.result == 'success' || (inputs.reuse_verified_macos_run_id != '' && needs.package-macos.result == 'skipped')) && needs.package-windows.result == 'success'
    permissions:
      contents: write
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Download verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          mkdir -p release-inputs/release-macos-arm64 release-inputs/release-windows-x64
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Artemis-macOS-arm64-*' --pattern '*-mac.yml' \
            --pattern release-manifest-macos-arm64.json --dir release-inputs/release-macos-arm64
          mv release-inputs/release-macos-arm64/release-manifest-macos-arm64.json release-inputs/release-macos-arm64/release-manifest.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Artemis-Windows-x64-*.zip' --pattern release-manifest-windows-x64.json \
            --dir release-inputs/release-windows-x64
          mv release-inputs/release-windows-x64/release-manifest-windows-x64.json release-inputs/release-windows-x64/release-manifest.json

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install release verification dependencies
        run: npm ci --ignore-scripts

      - name: Verify and combine both platform release sets
        run: node scripts/collect-release-assets.mjs release-inputs release-assets

      - name: Publish verified macOS and Windows packages
        env:
          GH_TOKEN: ${{ secrets.ARTEMIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        shell: bash
        run: |
          cp docs/records/release-notes.md "$RUNNER_TEMP/artemis-release-notes.md"
          printf '\nSource commit / 源码提交：`%s`.\n' "$RELEASE_SHA" >> "$RUNNER_TEMP/artemis-release-notes.md"
          target_repo=EurekaRaider/ArtemisRelease
          existing="$(gh release view "$RELEASE_TAG" --repo "$target_repo" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ -z "$existing" ]]; then
            gh release create "$RELEASE_TAG" --repo "$target_repo" --title "Artemis $RELEASE_TAG" --draft --notes-file "$RUNNER_TEMP/artemis-release-notes.md"
          elif [[ "$existing" != true ]]; then
            echo "Refusing to overwrite an existing public release." >&2
            exit 1
          fi
          # Only the validated allowlist is uploaded; never mirror the private source repository.
          node scripts/verify-slack-cli.mjs
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$target_repo" --clobber
          gh release view "$RELEASE_TAG" --repo "$target_repo" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/artemis-uploaded-assets.txt"
          (cd release-assets && printf '%s\n' *) | sort > "$RUNNER_TEMP/artemis-expected-assets.txt"
          diff -u "$RUNNER_TEMP/artemis-expected-assets.txt" "$RUNNER_TEMP/artemis-uploaded-assets.txt"
          gh release edit "$RELEASE_TAG" --repo "$target_repo" --notes-file "$RUNNER_TEMP/artemis-release-notes.md" --draft=false
