name: Office native validation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to validate
        type: choice
        options: [windows, macos]
        default: windows
  push:
    branches: [codex/office-workbench]
    paths:
      - .github/workflows/office-native-validation.yml
      - scripts/office/**
      - apps/desktop/native/office-bridge/**
      - apps/desktop/src/main/office-*.ts
      - apps/desktop/src/main/capability-*.ts
      - apps/desktop/src/renderer/Office*.tsx
      - apps/desktop/src/renderer/office-*
      - apps/desktop/test/office-*.test.ts
      - apps/desktop/test/capability-pack-service.test.ts
      - packages/protocol/src/artifact.ts
      - packages/protocol/src/capability-pack.ts
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: office-native-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Native Office (${{ inputs.platform || 'windows' }})
    runs-on: ${{ inputs.platform == 'macos' && fromJSON('["self-hosted", "macOS", "ARM64", "artemis-macos-arm64"]') || 'windows-2025' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
      - name: Restore verified build input cache
        id: source_cache
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: artifacts/office/sources
          key: office-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/office/sources.json') }}
      - name: Fetch and verify pinned engine, SDK and headers
        id: sources
        run: node scripts/office/fetch-sources.mjs
      - name: Save verified build inputs independently of sample acceptance
        if: steps.source_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: artifacts/office/sources
          key: ${{ steps.source_cache.outputs.cache-primary-key }}
      - name: Fetch and verify representative corpus
        run: node scripts/office/fetch-corpus.mjs
      - name: Mount official macOS build inputs read only
        id: mac_inputs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts/office/mount-office artifacts/office/mount-sdk
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/artifacts/office/mount-office" artifacts/office/sources/LibreOffice_26.8.0_MacOS_aarch64.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/artifacts/office/mount-sdk" artifacts/office/sources/LibreOffice_26.8.0_MacOS_aarch64_sdk.dmg
          echo "OFFICE=$PWD/artifacts/office/mount-office/LibreOffice.app/Contents/MacOS/soffice" >> "$GITHUB_ENV"
          echo "OFFICE_SDK=$PWD/artifacts/office/mount-sdk/LibreOffice26.8_SDK" >> "$GITHUB_ENV"
      - name: Extract Windows build inputs and configure the native compiler
        id: win_inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($item in @(@('LibreOffice_26.8.0_Win_x86-64.msi','office'), @('LibreOffice_26.8.0_Win_x86-64_sdk.msi','sdk'))) {
            $source = (Resolve-Path "artifacts/office/sources/$($item[0])").Path
            $target = Join-Path $PWD "artifacts/office/$($item[1])"
            $process = Start-Process msiexec.exe -ArgumentList @('/a', "`"$source`"", '/qn', "TARGETDIR=`"$target`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
          }
          $office = Get-ChildItem artifacts/office/office -Filter soffice.exe -Recurse | Select-Object -First 1
          $maker = Get-ChildItem artifacts/office/sdk -Filter cppumaker.exe -Recurse | Select-Object -First 1
          "OFFICE=$($office.FullName)" >> $env:GITHUB_ENV
          "OFFICE_SDK=$(Split-Path (Split-Path $maker.FullName))" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH')) { "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV }
      - name: Install verification dependencies
        run: npm ci
      - name: Build protocol and agent libraries
        run: npm run build:core
      - name: Prepare renderer verification
        id: prepare
        run: npm run build:ui-libraries
      - name: Verify Office policy, recovery and installation
        if: success()
        run: node node_modules/vitest/vitest.mjs run --no-file-parallelism apps/desktop/test/office-document-service.test.ts apps/desktop/test/office-session-service.test.ts apps/desktop/test/capability-pack-service.test.ts packages/protocol/test/artifact.test.ts
        env:
          NODE_OPTIONS: --no-experimental-webstorage
      - name: Verify real Electron preview and annotation
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node scripts/office/verify-preview.mjs
      - name: Compile and probe the macOS UNO bridge
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.mac_inputs.outcome == 'success' }}
        shell: bash
        run: |
          node scripts/office/build-bridge.mjs --sdk "$OFFICE_SDK" --office "$OFFICE" --json artifacts/office/sources/json.hpp --out artifacts/office/build
          node scripts/office/probe-native.mjs --office "$OFFICE" --bridge artifacts/office/build/office-bridge
      - name: Compile and probe the Windows UNO bridge
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.win_inputs.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/office/build-bridge.mjs --sdk "$env:OFFICE_SDK" --office "$env:OFFICE" --json artifacts/office/sources/json.hpp --out artifacts/office/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/office/probe-native.mjs --office "$env:OFFICE" --bridge artifacts/office/build/office-bridge.exe
      - name: Record Windows execution and trust evidence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item artifacts/office/evidence -ItemType Directory -Force | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $paths = @($env:OFFICE, (Join-Path $PWD 'artifacts/office/build/office-bridge.exe'))
          $binaries = foreach ($path in $paths) {
            if ($path -and (Test-Path $path)) {
              $signature = Get-AuthenticodeSignature $path
              $acl = Get-Acl $path
              [ordered]@{path=$path; sha256=(Get-FileHash $path -Algorithm SHA256).Hash; signatureStatus=[string]$signature.Status; signer=$signature.SignerCertificate.Subject; owner=$acl.Owner; sddl=$acl.Sddl}
            }
          }
          [ordered]@{
            schemaVersion=1; commit=$env:GITHUB_SHA; runnerOs=$env:RUNNER_OS; runnerArch=$env:RUNNER_ARCH
            imageOs=$env:ImageOS; imageVersion=$env:ImageVersion; windowsVersion=[Environment]::OSVersion.VersionString
            administrator=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            finalCapabilityPackage=$false; ordinaryUserValidated=$false; releaseAccepted=$false
            binaries=@($binaries)
          } | ConvertTo-Json -Depth 8 | Set-Content artifacts/office/evidence/windows.json -Encoding utf8
      - name: Build the trimmed unsigned Windows candidate
        id: candidate
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.win_inputs.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/office/build-candidate-verifier.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/office/build-candidate.mjs "$env:OFFICE" artifacts/office/build/office-bridge.exe
      - name: Accept the installed candidate as an ordinary user
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/office/verify-windows-user.ps1 -Candidate artifacts/office/candidate -Verifier artifacts/office/candidate-tools/verify-candidate.mjs
      - name: Capture each format from the installed candidate's preview
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.prepare.outcome == 'success' && steps.candidate.outcome == 'success' }}
        run: node scripts/office/verify-preview.mjs artifacts/office/panels artifacts/office/ordinary-user/native
      - name: Preserve native evidence, including failed cases
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: office-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/office/probe
            artifacts/office/preview
            artifacts/office/evidence
            artifacts/office/ordinary-user
            artifacts/office/panels
            artifacts/office/candidate/catalog.json
            artifacts/office/candidate/report.json
            artifacts/office/candidate/office-core-win32-x64.zip
          retention-days: 14
      - name: Preserve the exact candidate independently of Artifact quota
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            artifacts/office/candidate/catalog.json
            artifacts/office/candidate/report.json
            artifacts/office/candidate/office-core-win32-x64.zip
            artifacts/office/candidate-tools/verify-candidate.mjs
          key: office-candidate-win-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain checksummed evidence in CI logs
        if: always()
        run: node scripts/office/emit-ci-evidence.mjs
      - name: Detach macOS build input volumes
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil detach "$PWD/artifacts/office/mount-office" || true
          hdiutil detach "$PWD/artifacts/office/mount-sdk" || true
  windows-environment:
    name: Identify available Windows client environment
    if: ${{ inputs.platform != 'macos' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Record OS edition and current token without modifying the machine
        shell: cmd
        run: >-
          powershell.exe -NoProfile -NonInteractive -Command "$ErrorActionPreference='Stop'; $identity=[Security.Principal.WindowsIdentity]::GetCurrent(); $principal=[Security.Principal.WindowsPrincipal]::new($identity); [ordered]@{schemaVersion=1;commit='${{ github.sha }}';windows=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,ProductType);administrator=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator);clientAcceptance=$false;purpose='Read-only environment discovery'} | ConvertTo-Json -Depth 4 -Compress"
  windows-client:
    name: Installed candidate on Windows 11 ordinary user
    needs: probe
    if: ${{ inputs.platform != 'macos' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
      - name: Match the hosted runner's verified cache tools
        run: node scripts/office/prepare-windows-cache.mjs
      - name: Restore the exact candidate and verifier from this run
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            artifacts/office/candidate/catalog.json
            artifacts/office/candidate/report.json
            artifacts/office/candidate/office-core-win32-x64.zip
            artifacts/office/candidate-tools/verify-candidate.mjs
          key: office-candidate-win-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Fetch and verify the fixed public sample corpus
        run: node scripts/office/fetch-corpus.mjs
      - name: Accept and clean up the private ordinary-user client installation
        run: node scripts/office/verify-windows-client.mjs
      - name: Retain client evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: office-native-Windows-client
          path: artifacts/office/client
          retention-days: 14
      - name: Retain checksummed client evidence in logs
        if: always()
        run: node scripts/office/emit-ci-evidence.mjs
