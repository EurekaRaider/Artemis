name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build and format
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production bundles
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:production

  windows-native-sandbox:
    name: Windows native sandbox integration
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core packages
        run: npm run build:core

      - name: Build Electron workers
        run: npm run build:electron -w @artemis/desktop

      - name: Verify native Windows sandboxes
        run: >-
          npm test --workspace @artemis/desktop -- --run
          test/mcp-client-manager.test.ts
          test/terminal-service.integration.test.ts
          test/trusted-extension-manager.integration.test.ts

      - name: Verify Terminal and Browser professional shells in Electron
        run: npm run verify:workspace-dock -w @artemis/desktop
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}

  visual-convergence-electron:
    name: Visual convergence (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            label: macOS arm64
            runner: macos-15
          - id: macos-x64
            label: macOS x64
            runner: macos-15-intel
          - id: windows-x64
            label: Windows x64
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Windows display for desktop geometry
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-DisplayResolution

      - name: Verify exact-head visual convergence
        run: npm run verify:visual-convergence
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTEMIS_VISUAL_CONVERGENCE_OUTPUT: ${{ runner.temp }}/artemis-visual-convergence

      - name: Verify the locally built Windows package boundary
        if: runner.os == 'Windows'
        run: |
          npm run package:win
          npm run verify:win-native -w @artemis/desktop

      - name: Upload visual convergence evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-convergence-${{ matrix.id }}
          path: ${{ runner.temp }}/artemis-visual-convergence
          if-no-files-found: error

  ui-gallery-conformance:
    name: UI Gallery conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Gallery skin conformance
        run: npm run verify:ui-gallery-conformance
