name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build and format
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production bundles
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows-native-sandbox:
    name: Windows native sandbox integration
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core packages
        run: npm run build:core

      - name: Build Electron workers
        run: npm run build:electron -w @artemis/desktop

      - name: Verify native Windows sandboxes
        run: >-
          npm test --workspace @artemis/desktop -- --run
          test/mcp-client-manager.test.ts
          test/terminal-service.integration.test.ts
          test/trusted-extension-manager.integration.test.ts

  desktop-skin-electron:
    name: Desktop skin Electron and package boundary
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Desktop skin runtime and package isolation
        run: npm run verify:desktop-skin

      - name: Verify field and selection controls in production Electron
        run: npm run verify:form-controls

      - name: Verify tabs and segmented controls in production Electron
        run: npm run verify:navigation-controls
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}

      - name: Verify feedback and layout controls in production Electron
        run: npm run verify:feedback-layout
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}

  ui-gallery-conformance:
    name: UI Gallery conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Gallery skin conformance
        run: npm run verify:ui-gallery-conformance
