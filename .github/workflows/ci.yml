name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-p0:
    name: Design workflow (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify native design preview
        run: npm run verify:design-p0
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTEMIS_DESIGN_P0_OUTPUT: ${{ runner.temp }}/artemis-design-p0
      - name: Verify rendered design workflow
        run: node apps/desktop/scripts/verify-design-workflow.mjs
        env:
          ARTEMIS_DESIGN_UI_OUTPUT: ${{ runner.temp }}/artemis-design-ui
      - name: Verify design persistence and workflow policy
        run: npx vitest run apps/desktop/test/design-source.test.ts apps/desktop/test/design-store.test.ts apps/desktop/test/design-watchdog.test.ts apps/desktop/test/design-repository.test.ts apps/desktop/test/design-image.test.ts apps/desktop/test/design-service.test.ts packages/agent-host/test/design-workflow.test.ts
      - name: Upload design P0 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: design-p0-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/artemis-design-p0/**/*report.json
            ${{ runner.temp }}/artemis-design-ui/**/report.json
          if-no-files-found: error

  verify:
    name: Test, typecheck, build and format
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run portable CI checks
        run: npm run verify:ci
        env:
          ARTEMIS_SKIP_PRODUCTION_AUDIT: ${{ vars.ARTEMIS_SKIP_PRODUCTION_AUDIT }}

  windows-native-sandbox:
    name: Windows native sandbox integration
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core packages
        run: npm run build:core

      - name: Build Electron workers
        run: npm run build:electron -w @artemis/desktop

      - name: Verify native Windows sandboxes
        run: >-
          npm test --workspace @artemis/desktop -- --run
          test/mcp-client-manager.test.ts
          test/terminal-service.integration.test.ts
          test/trusted-extension-manager.integration.test.ts
          test/im-windows-files.test.ts
          test/attachment-store.test.ts

      - name: Verify Terminal and Browser professional shells in Electron
        run: npm run verify:workspace-dock -w @artemis/desktop
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}

  visual-convergence-electron:
    name: Visual convergence (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            label: macOS arm64
            runner: macos-15
          - id: macos-x64
            label: macOS x64
            runner: macos-15-intel
          - id: windows-x64
            label: Windows x64
            runner: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Windows display for desktop geometry
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-DisplayResolution

      - name: Verify exact-head visual convergence
        run: npm run verify:visual-convergence
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTEMIS_VISUAL_CONVERGENCE_OUTPUT: ${{ runner.temp }}/artemis-visual-convergence

      - name: Verify the locally built Windows package boundary
        if: runner.os == 'Windows'
        run: |
          npm run package:win
          npm run verify:win-native -w @artemis/desktop

      - name: Upload visual convergence evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-convergence-${{ matrix.id }}
          path: ${{ runner.temp }}/artemis-visual-convergence
          if-no-files-found: error

  ui-gallery-conformance:
    name: UI Gallery conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Gallery skin conformance
        run: npm run verify:ui-gallery-conformance
