name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, build and format
    if: github.event.repository.private
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run portable CI checks
        run: npm run verify:ci
        env:
          ARTEMIS_SKIP_PRODUCTION_AUDIT: ${{ vars.ARTEMIS_SKIP_PRODUCTION_AUDIT }}
          GITHUB_TOKEN: ${{ github.token }}

  slack-cli-native:
    name: Slack CLI native compatibility (macOS arm64)
    if: github.event.repository.private
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Verify official native CLI and bundled hooks
        run: node scripts/test-slack-cli-native.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  visual-convergence-electron:
    name: Visual convergence (macOS arm64)
    if: github.event.repository.private
    runs-on: [self-hosted, macOS, ARM64, artemis-macos-arm64]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact-head visual convergence
        run: npm run verify:visual-convergence
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}
          ARTEMIS_VISUAL_CONVERGENCE_OUTPUT: ${{ runner.temp }}/artemis-visual-convergence

      - name: Upload visual convergence evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-convergence-macos-arm64
          path: ${{ runner.temp }}/artemis-visual-convergence
          if-no-files-found: error
