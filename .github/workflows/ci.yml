name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, build and format (${{ matrix.platform }})
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, artemis-macos-arm64]
          - platform: windows-x64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Normalize reused Windows checkout to LF
        if: matrix.platform == 'windows-x64'
        run: node scripts/normalize-windows-checkout.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run portable CI checks
        run: npm run verify:ci
        env:
          ARTEMIS_SKIP_PRODUCTION_AUDIT: ${{ vars.ARTEMIS_SKIP_PRODUCTION_AUDIT }}
          GITHUB_TOKEN: ${{ github.token }}

  slack-cli-native:
    name: Slack CLI native compatibility (${{ matrix.platform }})
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, artemis-macos-arm64]
          - platform: windows-x64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Normalize reused Windows checkout to LF
        if: matrix.platform == 'windows-x64'
        run: node scripts/normalize-windows-checkout.mjs
      - run: npm ci
      - name: Verify official native CLI and bundled hooks
        run: node scripts/test-slack-cli-native.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Diagnose Windows CLI startup after failure
        if: failure() && matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $binary = 'artifacts/slack-cli/win32-x64/slack.exe'
          if (-not (Test-Path $binary)) { exit 0 }
          Get-AuthenticodeSignature $binary | Select-Object Status, StatusMessage | Format-List
          $stdout = Join-Path $env:RUNNER_TEMP 'slack-version-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'slack-version-stderr.txt'
          try {
            $probe = Start-Process -FilePath $binary -ArgumentList '--version' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 20
            $probe.Refresh()
            Write-Host "Slack CLI exited: $($probe.HasExited); CPU seconds: $($probe.TotalProcessorTime.TotalSeconds)"
            if (-not $probe.HasExited) { Stop-Process -Id $probe.Id -Force }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          } catch {
            Write-Host "Windows CLI diagnostic: $($_.Exception.Message)"
          }
          foreach ($log in @('Microsoft-Windows-CodeIntegrity/Operational', 'Microsoft-Windows-Windows Defender/Operational')) {
            try {
              Get-WinEvent -FilterHashtable @{ LogName = $log; StartTime = (Get-Date).AddMinutes(-10) } -MaxEvents 10 -ErrorAction Stop |
                Select-Object TimeCreated, Id, ProviderName, Message | Format-List
            } catch {
              Write-Host "No readable recent events in $log."
            }
          }
      - name: Compare Windows Node CLI spawn modes after failure
        if: failure() && matrix.platform == 'windows-x64'
        run: node scripts/diagnose-slack-windows.mjs

  visual-convergence-electron:
    name: Visual convergence (${{ matrix.platform }})
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, artemis-macos-arm64]
          - platform: windows-x64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Normalize reused Windows checkout to LF
        if: matrix.platform == 'windows-x64'
        run: node scripts/normalize-windows-checkout.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify exact-head visual convergence
        run: npm run verify:visual-convergence
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}
          ARTEMIS_VISUAL_CONVERGENCE_OUTPUT: ${{ runner.temp }}/artemis-visual-convergence

      - name: Upload visual convergence evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: visual-convergence-${{ matrix.platform }}
          path: ${{ runner.temp }}/artemis-visual-convergence
          if-no-files-found: error
          retention-days: 1
