name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, build and format (${{ matrix.platform }})
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, artemis-macos-arm64]
          - platform: windows-x64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize reused Windows checkout to LF
        if: matrix.platform == 'windows-x64'
        run: git -c core.autocrlf=false checkout-index --force --all

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run portable CI checks
        run: npm run verify:ci
        env:
          ARTEMIS_SKIP_PRODUCTION_AUDIT: ${{ vars.ARTEMIS_SKIP_PRODUCTION_AUDIT }}
          GITHUB_TOKEN: ${{ github.token }}

  slack-cli-native:
    name: Slack CLI native compatibility (${{ matrix.platform }})
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, artemis-macos-arm64]
          - platform: windows-x64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Normalize reused Windows checkout to LF
        if: matrix.platform == 'windows-x64'
        run: git -c core.autocrlf=false checkout-index --force --all
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - name: Verify official native CLI and bundled hooks
        run: node scripts/test-slack-cli-native.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  visual-convergence-electron:
    name: Visual convergence (${{ matrix.platform }})
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: [self-hosted, macOS, ARM64, artemis-macos-arm64]
          - platform: windows-x64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Normalize reused Windows checkout to LF
        if: matrix.platform == 'windows-x64'
        run: git -c core.autocrlf=false checkout-index --force --all

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Verify exact-head visual convergence
        run: npm run verify:visual-convergence
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}
          ARTEMIS_VISUAL_CONVERGENCE_OUTPUT: ${{ runner.temp }}/artemis-visual-convergence

      - name: Upload visual convergence evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: visual-convergence-${{ matrix.platform }}
          path: ${{ runner.temp }}/artemis-visual-convergence
          if-no-files-found: error
          retention-days: 1
