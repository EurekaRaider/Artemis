name: CI
"on":
  workflow_call: null
  workflow_dispatch:
    inputs:
      hooks_only:
        description: Run native Hooks acceptance and engineering package checks
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request: null
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.platform == 'windows-x64' && 'Shared checks (windows-x64)' || 'Test, typecheck, build and format (macos-arm64)' }}
    if: ${{ !inputs.hooks_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Normalize reused Windows checkout to LF
        if: matrix.platform == 'windows-x64'
        run: node scripts/ci/normalize-windows-checkout.mjs
      - name: Install dependencies
        run: npm ci
      - name: Exercise independent update recovery failures
        if: matrix.platform == 'windows-x64'
        shell: powershell
        run: ./scripts/release/test-windows-update-recovery.ps1
      - name: Check Windows design runtime sandbox before the full suite
        if: matrix.platform == 'windows-x64'
        run: |
          npm run build:core
          npx vitest run --root apps/desktop --no-file-parallelism test/main/design/design-plugin-runtime-worker-sandbox.test.ts test/main/im/im-slack-setup-service.test.ts -t "allows reads and writes|denies network access|abnormal exit|cancels the child"
      - name: Compile Windows Computer Use helper and GPU preview without release credentials
        if: matrix.platform == 'windows-x64'
        run: |
          cmake -S apps/desktop/native/computer-use/windows -B artifacts/verification/computer-use/ci-build -A x64
          cmake --build artifacts/verification/computer-use/ci-build --config Release
          node apps/desktop/scripts/build/build-computer-preview.mjs artifacts/verification/computer-use/ci-preview
      - name: Exercise background browser input and native form controls
        run: |
          npm run build:core
          node apps/desktop/scripts/verify/native/verify-computer-browser-input.mjs
      - name: Run portable CI checks
        if: matrix.platform == 'macos-arm64'
        run: npm run verify:ci
        env:
          ARTEMIS_SKIP_PRODUCTION_AUDIT: ${{ vars.ARTEMIS_SKIP_PRODUCTION_AUDIT }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run shared Windows CI checks
        if: matrix.platform == 'windows-x64'
        run: npm run verify:ci -- --shared-tests
        env:
          ARTEMIS_SKIP_PRODUCTION_AUDIT: ${{ vars.ARTEMIS_SKIP_PRODUCTION_AUDIT }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify official native CLI and bundled hooks
        run: node scripts/slack/test-slack-cli-native.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Diagnose Windows CLI startup after failure
        if: failure() && matrix.platform == 'windows-x64'
        shell: pwsh
        run: >
          $binary = 'artifacts/slack-cli/win32-x64/slack.exe'

          if (-not (Test-Path $binary)) { exit 0 }

          Get-AuthenticodeSignature $binary | Select-Object Status, StatusMessage | Format-List

          $stdout = Join-Path $env:RUNNER_TEMP 'slack-version-stdout.txt'

          $stderr = Join-Path $env:RUNNER_TEMP 'slack-version-stderr.txt'

          try {
            $probe = Start-Process -FilePath $binary -ArgumentList '--version' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 20
            $probe.Refresh()
            Write-Host "Slack CLI exited: $($probe.HasExited); CPU seconds: $($probe.TotalProcessorTime.TotalSeconds)"
            if (-not $probe.HasExited) { Stop-Process -Id $probe.Id -Force }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          } catch {
            Write-Host "Windows CLI diagnostic: $($_.Exception.Message)"
          }

          foreach ($log in @('Microsoft-Windows-CodeIntegrity/Operational', 'Microsoft-Windows-Windows
          Defender/Operational')) {
            try {
              Get-WinEvent -FilterHashtable @{ LogName = $log; StartTime = (Get-Date).AddMinutes(-10) } -MaxEvents 10 -ErrorAction Stop |
                Select-Object TimeCreated, Id, ProviderName, Message | Format-List
            } catch {
              Write-Host "No readable recent events in $log."
            }
          }
      - run: node scripts/benchmarks/benchmark-history.mjs
      - run: node --expose-gc scripts/benchmarks/benchmark-streaming.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: performance-${{ matrix.platform }}
          path: artifacts/benchmarks
          retention-days: 14
          if-no-files-found: error
  macos-x64-checks:
    name: Shared checks (macos-x64)
    if: ${{ !inputs.hooks_only }}
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify native Intel runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'x64') process.exit(1)"
      - run: npm ci
      - name: Exercise background browser input and native form controls
        run: |
          npm run build:core
          node apps/desktop/scripts/verify/native/verify-computer-browser-input.mjs
      - name: Run shared macOS x64 CI checks
        run: npm run verify:ci -- --shared-tests
        env:
          ARTEMIS_SKIP_PRODUCTION_AUDIT: ${{ vars.ARTEMIS_SKIP_PRODUCTION_AUDIT }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify official native CLI and bundled hooks
        run: node scripts/slack/test-slack-cli-native.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/benchmarks/benchmark-history.mjs
      - run: node --expose-gc scripts/benchmarks/benchmark-streaming.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: performance-macos-x64
          path: artifacts/benchmarks
          retention-days: 14
          if-no-files-found: error
  macos-x64-desktop-tests:
    name: Desktop tests (macos-x64, shard ${{ matrix.shard }}/2)
    if: ${{ !inputs.hooks_only }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify native Intel runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'x64') process.exit(1)"
      - run: npm ci
      - run: npm run build
      - name: Run isolated desktop test shard
        run: npm run test -w @artemis/desktop -- --shard=${{ matrix.shard }}/2
  macos-x64-acceptance:
    name: Test, typecheck, build and format (macos-x64)
    needs: [macos-x64-checks, macos-x64-desktop-tests]
    if: ${{ !inputs.hooks_only && always() }}
    runs-on: macos-15-intel
    timeout-minutes: 3
    steps:
      - name: Require shared checks and every desktop shard
        run: node -e "if (process.env.SHARED_RESULT !== 'success' || process.env.DESKTOP_RESULT !== 'success') process.exit(1)"
        env:
          SHARED_RESULT: ${{ needs.macos-x64-checks.result }}
          DESKTOP_RESULT: ${{ needs.macos-x64-desktop-tests.result }}
  windows-desktop-tests:
    name: Desktop tests (windows-x64, shard ${{ matrix.shard }}/4)
    if: ${{ !inputs.hooks_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            shard: 1
          - platform: windows-x64
            runner: windows-2025
            shard: 2
          - platform: windows-x64
            runner: windows-2025
            shard: 3
          - platform: windows-x64
            runner: windows-2025
            shard: 4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Normalize Windows checkout to LF
        run: node scripts/ci/normalize-windows-checkout.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build production bundles
        run: npm run build
      - name: Run isolated desktop test shard
        run: npm run test -w @artemis/desktop -- --shard=${{ matrix.shard }}/4
  windows-acceptance:
    name: Test, typecheck, build and format (windows-x64)
    needs: [verify, windows-desktop-tests]
    if: ${{ !inputs.hooks_only && always() }}
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - name: Require shared checks and every desktop shard
        shell: pwsh
        run: |
          if ('${{ needs.verify.result }}' -ne 'success' -or '${{ needs.windows-desktop-tests.result }}' -ne 'success') {
            throw 'Windows CI requires successful shared checks and all four desktop test shards.'
          }
  visual-convergence-electron:
    name: Visual convergence (${{ matrix.platform }})
    if: ${{ !inputs.hooks_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Normalize reused Windows checkout to LF
        if: matrix.platform == 'windows-x64'
        run: node scripts/ci/normalize-windows-checkout.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify exact-head visual convergence
        run: npm run verify:visual-convergence
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}
          ARTEMIS_VISUAL_CONVERGENCE_OUTPUT: ${{ runner.temp }}/artemis-visual-convergence
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve visual convergence evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-convergence-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/artemis-visual-convergence/**/*.json
            ${{ runner.temp }}/artemis-visual-convergence/**/*.png
            ${{ runner.temp }}/artemis-visual-convergence/**/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Windows window material and panel motion
        if: matrix.platform == 'windows-x64'
        run: node apps/desktop/scripts/verify/ui/verify-window-glass.mjs
        env:
          ARTEMIS_GLASS_EXTENDED: "1"
          ARTEMIS_GLASS_ASSERT_MOTION: "1"
      - name: Preserve Windows window material evidence
        if: always() && matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v6
        with:
          name: window-glass-${{ matrix.platform }}-${{ github.run_attempt }}
          path: artifacts/verification/window-glass
          if-no-files-found: warn
          retention-days: 7
  macos-visual-shards:
    name: Visual workloads (macos-arm64, shard ${{ matrix.shard }}/3)
    if: ${{ !inputs.hooks_only }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - name: Verify exact-head visual workload shard
        run: npm run verify:visual-convergence -- --shard=${{ matrix.shard }}/3
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}
          ARTEMIS_VISUAL_CONVERGENCE_OUTPUT: ${{ runner.temp }}/artemis-visual-convergence
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve visual convergence evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-convergence-macos-arm64-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/artemis-visual-convergence/**/*.json
            ${{ runner.temp }}/artemis-visual-convergence/**/*.png
            ${{ runner.temp }}/artemis-visual-convergence/**/*.log
          if-no-files-found: error
          retention-days: 7
  macos-visual-acceptance:
    name: Visual convergence (macos-arm64)
    needs: [macos-visual-shards]
    if: ${{ !inputs.hooks_only && always() }}
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - name: Require every macOS visual shard
        run: node -e "if (process.env.ARTEMIS_VISUAL_SHARD_RESULT !== 'success') process.exit(1)"
        env:
          ARTEMIS_VISUAL_SHARD_RESULT: ${{ needs.macos-visual-shards.result }}
  macos-x64-visual-shards:
    name: Visual workloads (macos-x64, shard ${{ matrix.shard }}/3)
    if: ${{ !inputs.hooks_only }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify native Intel runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'x64') process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Verify exact-head visual workload shard
        run: npm run verify:visual-convergence -- --shard=${{ matrix.shard }}/3
        env:
          ARTEMIS_EXPECTED_HEAD: ${{ github.sha }}
          ARTEMIS_VISUAL_CONVERGENCE_OUTPUT: ${{ runner.temp }}/artemis-visual-convergence
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve visual convergence evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-convergence-macos-x64-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/artemis-visual-convergence/**/*.json
            ${{ runner.temp }}/artemis-visual-convergence/**/*.png
            ${{ runner.temp }}/artemis-visual-convergence/**/*.log
          if-no-files-found: error
          retention-days: 7
  macos-x64-visual-acceptance:
    name: Visual convergence (macos-x64)
    needs: [macos-x64-visual-shards]
    if: ${{ !inputs.hooks_only && always() }}
    runs-on: macos-15-intel
    timeout-minutes: 3
    steps:
      - name: Require every macOS visual shard
        run: node -e "if (process.env.ARTEMIS_VISUAL_SHARD_RESULT !== 'success') process.exit(1)"
        env:
          ARTEMIS_VISUAL_SHARD_RESULT: ${{ needs.macos-x64-visual-shards.result }}
  hooks-native:
    name: Hooks native acceptance (${{ matrix.platform }})
    env:
      GITHUB_TOKEN: ${{ github.token }}
    if: inputs.hooks_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Normalize Windows checkout
        if: matrix.platform == 'windows-x64'
        run: node scripts/ci/normalize-windows-checkout.mjs
      - run: npm ci
      - run: npm run build
      - name: Native service, lifecycle and trust UI tests
        run: >-
          npx vitest run apps/desktop/test/main/hooks/hooks-service.test.ts packages/agent-host/test/runtime/hooks-bridge.test.ts
          apps/desktop/test/renderer/hooks/hooks-settings.test.tsx
        env:
          NODE_OPTIONS: "--no-experimental-webstorage"
      - name: Exercise desktop trust and real command execution
        run: node apps/desktop/scripts/verify/native/verify-hooks-native.mjs
      - name: Package Windows engineering artifact
        if: matrix.platform == 'windows-x64'
        run: npm run package:win
      - name: Verify Windows artifact, ACLs and normal startup
        if: matrix.platform == 'windows-x64'
        run: npm run verify:win-native -w @artemis/desktop
      - name: Package macOS engineering artifacts
        if: startsWith(matrix.platform, 'macos-')
        run: npm run package:mac:${{ matrix.platform == 'macos-x64' && 'x64' || 'arm64' }}
      - name: Upload native acceptance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: hooks-native-${{ matrix.platform }}
          path: artifacts/verification/hooks-native
          if-no-files-found: warn
          retention-days: 7
