name: Release Windows Office runtime
"on":
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the already published immutable Windows runtime
        type: boolean
        default: false
      version:
        description: New immutable Office runtime version
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: office-windows-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && !inputs.verify_only
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
      - uses: actions/download-artifact@v6
        with:
          name: office-candidate-windows
          path: artifacts/office/candidate
      - run: npm ci
      - run: npm run build:core
      - name: Authenticate the manifest without signing or changing the Windows binaries
        run: node scripts/office/prepare-windows-release.mjs
        env:
          OFFICE_RUNTIME_ED25519_PRIVATE_KEY: ${{ secrets.OFFICE_RUNTIME_ED25519_PRIVATE_KEY }}
      - name: Publish immutable runtime assets without changing app Latest
        env:
          GH_TOKEN: ${{ secrets.ARTEMIS_RELEASE_TOKEN }}
        run: node scripts/office/publish-windows-release.mjs
    needs: build
    env:
      OFFICE_RUNTIME_VERSION: ${{ inputs.version }}
      OFFICE_CANDIDATE_COMMIT: ${{ github.sha }}
  verify-online-install:
    needs: publish
    if: github.ref == 'refs/heads/main' && always() && (needs.publish.result == 'success' || inputs.verify_only)
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
      - run: node scripts/ci/normalize-windows-checkout.mjs
      - run: npm ci
      - run: npm run build:core
      - run: node scripts/office/build-public-verifier.mjs
      - run: node scripts/office/fetch-corpus.mjs
      - name: Download the public catalog snapshot anonymously
        run: >-
          node --input-type=module -e "import {writeFile} from 'node:fs/promises';const r=await
          fetch('https://github.com/EurekaRaider/ArtemisRelease/releases/download/office-runtime-v'+process.env.OFFICE_RUNTIME_VERSION+'/catalog.json');if(!r.ok)throw
          Error(r.status);await writeFile('artifacts/office/public-catalog.json',new Uint8Array(await
          r.arrayBuffer()));"
      - name: Verify production-host online install, native preview and final ACLs
        run: node artifacts/office/public-tools/verify-public-windows.mjs artifacts/office/public-catalog.json
      - name: Publish installation catalog after Windows acceptance
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.ARTEMIS_RELEASE_TOKEN }}
        run: node scripts/office/publish-office-catalog.mjs artifacts/office/public-catalog.json
      - name: Retain verification report in logs
        if: always()
        run: >-
          node -e "const fs=require('fs');const
          p='artifacts/office/public-windows/report.json';if(fs.existsSync(p))console.log(fs.readFileSync(p,'utf8'));"
    env:
      OFFICE_RUNTIME_VERSION: ${{ inputs.version }}
  build:
    if: github.ref == 'refs/heads/main' && !inputs.verify_only
    uses: ./.github/workflows/office-native-validation.yml
    with:
      platform: windows
