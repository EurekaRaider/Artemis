<!DOCTYPE html>
<!-- artemis-design 工作区面板（S1 目标 5）
     视觉基线：docs/ui-prototype/artemis-ui.html design 面板（约 467-600 行），类名不得偏离。
     自包含单文件：内联 CSS + 内联 SVG，暗色主题，静态 mock 数据。
     安全衔接：dzComposerSend 仅 dispatch CustomEvent("artemis:candidate-prompt")，
     不发起任何 fetch / ipc / 父窗口调用。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Artemis Design · 工作区</title>
<style>
  :root {
    --bg: #101216;
    --bg-panel: #16191f;
    --bg-raised: #1c2028;
    --bg-hover: #232833;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.16);
    --danger: #ff6b6b;
    --radius: 10px;
    --menu-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sp { flex: 1; }

  /* ---- 页签条（原型 .design-ws-tabs / .design-ws-tab / .design-ws-label / .design-ws-x / .design-ws-add） ---- */
  .design-ws-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .design-ws-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 180px;
    padding: 5px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    cursor: pointer;
  }
  .design-ws-tab:hover { background: var(--bg-hover); color: var(--text); }
  .design-ws-tab.active { background: var(--accent-soft); color: var(--text); }
  .design-ws-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .design-ws-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 4px;
    color: var(--text-dim);
  }
  .design-ws-x:hover { background: var(--bg-hover); color: var(--danger); }
  .dz-plus { position: relative; }
  .design-ws-add {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .design-ws-add:hover { background: var(--bg-hover); color: var(--text); }

  /* ---- 动作区（原型 .design-ws-actions / .design-ws-present / .design-ws-iconbtn / .design-ws-export） ---- */
  .design-ws-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .design-ws-present { position: relative; }
  .design-ws-iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .design-ws-iconbtn:hover { background: var(--bg-hover); color: var(--text); }
  .design-ws-export {
    padding: 5px 14px;
    border: 0;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .design-ws-export:hover { filter: brightness(1.1); }
  .dz-export { position: relative; }

  /* ---- 弹出菜单（原型 .dz-menu / .dz-menu-item / .dz-plus-menu / .dz-present-menu / .dz-export-menu） ---- */
  .dz-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 30;
    min-width: 172px;
    padding: 5px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--menu-shadow);
  }
  .dz-plus-menu { left: 0; }
  .dz-present-menu, .dz-export-menu { right: 0; left: auto; }
  .dz-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .dz-menu-item:hover { background: var(--bg-hover); }

  /* ---- 文件浏览视图（原型 .design-files / .design-crumb / .design-cats / .design-file-card） ---- */
  .design-files {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 16px 0;
  }
  .design-crumb {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .design-crumb-project { font-weight: 600; }
  .design-cats {
    display: flex;
    gap: 6px;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  .design-cat {
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .design-cat.active { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .design-cat-count { opacity: 0.65; margin-left: 2px; }
  .design-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
    padding-bottom: 16px;
  }
  .design-file-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-panel);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .design-file-card:hover { border-color: var(--accent); }
  .design-file-thumb {
    display: block;
    height: 84px;
    border-radius: 7px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
  }
  .design-file-name { font-weight: 600; }
  .design-file-sub { color: var(--text-dim); font-size: 12px; }

  /* ---- 创作输入（原型 .design-composer / .design-composer-input / .design-composer-actions） ---- */
  .design-composer {
    flex: none;
    margin: 0 16px 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-panel);
  }
  .design-composer-input {
    min-height: 40px;
    max-height: 120px;
    overflow-y: auto;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .design-composer-input:empty::before {
    content: attr(data-placeholder);
    color: var(--text-dim);
  }
  .design-composer-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .design-composer-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .design-composer-btn:hover { background: var(--bg-hover); color: var(--text); }
  .design-composer-send {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .design-composer-send:disabled { opacity: 0.4; cursor: default; }

  /* ---- 预览视图（原型 .design-preview-view / .dz-toolbar / .dz-mode-tab） ---- */
  .design-preview-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .dz-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .dz-toolbar-left { display: flex; align-items: center; gap: 8px; }
  .dz-mode {
    display: flex;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-panel);
  }
  .dz-mode-tab {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .dz-mode-tab.active { background: var(--accent-soft); color: var(--text); }
  .dz-viewport {
    flex: 1;
    overflow: auto;
    padding: 20px;
  }
  .dz-stage {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-panel);
  }
  .dz-source {
    flex: 1;
    margin: 0;
    padding: 16px;
    overflow: auto;
    color: var(--text-dim);
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre;
  }

  /* ---- toast（原型 .dz-toast） ---- */
  .dz-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 60;
    padding: 8px 16px;
    border-radius: 8px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    box-shadow: var(--menu-shadow);
    color: var(--text);
  }
</style>
</head>

<script>
(function () {
  "use strict";
  // 交互模式照原型：菜单开合、data-dz-toast、页签切换、composer 发送。
  var toast = document.getElementById("dzToast");
  var toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 2200);
  }

  // ---- 弹出菜单（plus / present / export）----
  var menus = [
    { btn: document.getElementById("dzPlusBtn"), menu: document.getElementById("dzPlusMenu") },
    { btn: document.getElementById("dzPresentBtn"), menu: document.getElementById("dzPresentMenu") },
    { btn: document.getElementById("dzExportBtn"), menu: document.getElementById("dzExportMenu") }
  ];
  function closeMenus(except) {
    menus.forEach(function (m) {
      if (m.menu !== except) {
        m.menu.hidden = true;
        m.btn.setAttribute("aria-expanded", "false");
      }
    });
  }
  menus.forEach(function (m) {
    m.btn.addEventListener("click", function (event) {
      event.stopPropagation();
      var willOpen = m.menu.hidden;
      closeMenus(m.menu);
      m.menu.hidden = !willOpen;
      m.btn.setAttribute("aria-expanded", String(!m.menu.hidden));
    });
  });
  document.addEventListener("click", function () { closeMenus(null); });
  document.addEventListener("click", function (event) {
    var target = event.target.closest("[data-dz-toast]");
    if (target) {
      showToast(target.getAttribute("data-dz-toast"));
      closeMenus(null);
    }
  });

  // ---- 版本历史（只显示 toast，如原型行为）----
  document.getElementById("dzHistoryBtn").addEventListener("click", function () {
    showToast("版本历史（演示）");
  });

  // ---- 页签切换：files 视图 <-> preview 视图 ----
  var viewFiles = document.getElementById("dzViewFiles");
  var viewPreview = document.getElementById("dzViewPreview");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".design-ws-tab"));
  function selectTab(tab) {
    tabs.forEach(function (t) {
      var active = t === tab;
      t.classList.toggle("active", active);
      t.setAttribute("aria-selected", String(active));
    });
    var isFiles = tab.getAttribute("data-dz-view") === "files";
    viewFiles.hidden = !isFiles;
    viewPreview.hidden = isFiles;
    closeMenus(null);
  }
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function (event) {
      if (event.target.closest(".design-ws-x")) {
        // 关闭钮：切回文件视图（静态 mock，原型会移除标签）
        selectTab(tabs[0]);
        return;
      }
      selectTab(tab);
    });
  });
  document.querySelectorAll("[data-dz-open]").forEach(function (item) {
    item.addEventListener("click", function () {
      var file = item.getAttribute("data-dz-open");
      var fileTab = tabs.find(function (t) { return t.getAttribute("data-dz-file") === file; });
      if (fileTab) selectTab(fileTab);
      closeMenus(null);
    });
  });

  // ---- 预览 | 代码 切换 ----
  var viewport = document.getElementById("dzViewport");
  var source = document.getElementById("dzSource");
  document.querySelectorAll(".dz-mode-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".dz-mode-tab").forEach(function (t) {
        var active = t === tab;
        t.classList.toggle("active", active);
        t.setAttribute("aria-selected", String(active));
      });
      var isSource = tab.getAttribute("data-dz-mode") === "source";
      viewport.hidden = isSource;
      source.hidden = !isSource;
    });
  });

  // ---- 创作输入：发送仅 dispatch candidate-prompt 事件，不做任何 fetch/ipc/父窗口调用 ----
  var composerInput = document.querySelector(".design-composer-input");
  var composerSend = document.getElementById("dzComposerSend");
  function syncSendState() {
    composerSend.disabled = composerInput.textContent.trim().length === 0;
  }
  composerInput.addEventListener("input", syncSendState);
  composerSend.addEventListener("click", function () {
    var text = composerInput.textContent.trim();
    if (!text) return;
    composerInput.dispatchEvent(
      new CustomEvent("artemis:candidate-prompt", {
        detail: { text: text, source: "panel" },
        bubbles: true
      })
    );
    composerInput.textContent = "";
    syncSendState();
    showToast("已发送到对话输入框");
  });
})();
</script>
</body>
</html>
