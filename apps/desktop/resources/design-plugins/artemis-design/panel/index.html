<!DOCTYPE html>
<!-- artemis-design 工作区面板（S1 目标 5）
     视觉基线：docs/ui-prototype/artemis-ui.html design 面板（约 467-600 行），类名不得偏离。
     自包含单文件：内联 CSS + 内联 SVG，暗色主题，静态 mock 数据。
     安全衔接：dzComposerSend 仅 dispatch CustomEvent("artemis:candidate-prompt")，
     不发起任何 fetch / ipc / 父窗口调用。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Artemis Design · 工作区</title>
<style>
  :root {
    --bg: #101216;
    --bg-panel: #16191f;
    --bg-raised: #1c2028;
    --bg-hover: #232833;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.16);
    --danger: #ff6b6b;
    --radius: 10px;
    --menu-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sp { flex: 1; }

  /* ---- 页签条（原型 .design-ws-tabs / .design-ws-tab / .design-ws-label / .design-ws-x / .design-ws-add） ---- */
  .design-ws-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .design-ws-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 180px;
    padding: 5px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    cursor: pointer;
  }
  .design-ws-tab:hover { background: var(--bg-hover); color: var(--text); }
  .design-ws-tab.active { background: var(--accent-soft); color: var(--text); }
  .design-ws-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .design-ws-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 4px;
    color: var(--text-dim);
  }
  .design-ws-x:hover { background: var(--bg-hover); color: var(--danger); }
  .dz-plus { position: relative; }
  .design-ws-add {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .design-ws-add:hover { background: var(--bg-hover); color: var(--text); }

  /* ---- 动作区（原型 .design-ws-actions / .design-ws-present / .design-ws-iconbtn / .design-ws-export） ---- */
  .design-ws-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .design-ws-present { position: relative; }
  .design-ws-iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .design-ws-iconbtn:hover { background: var(--bg-hover); color: var(--text); }
  .design-ws-export {
    padding: 5px 14px;
    border: 0;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .design-ws-export:hover { filter: brightness(1.1); }
  .dz-export { position: relative; }

  /* ---- 弹出菜单（原型 .dz-menu / .dz-menu-item / .dz-plus-menu / .dz-present-menu / .dz-export-menu） ---- */
  .dz-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 30;
    min-width: 172px;
    padding: 5px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--menu-shadow);
  }
  .dz-plus-menu { left: 0; }
  .dz-present-menu, .dz-export-menu { right: 0; left: auto; }
  .dz-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .dz-menu-item:hover { background: var(--bg-hover); }

  /* ---- 文件浏览视图（原型 .design-files / .design-crumb / .design-cats / .design-file-card） ---- */
  .design-files {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 16px 0;
  }
  .design-crumb {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .design-crumb-project { font-weight: 600; }
  .design-cats {
    display: flex;
    gap: 6px;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  .design-cat {
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .design-cat.active { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .design-cat-count { opacity: 0.65; margin-left: 2px; }
  .design-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
    padding-bottom: 16px;
  }
  .design-file-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-panel);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .design-file-card:hover { border-color: var(--accent); }
  .design-file-thumb {
    display: block;
    height: 84px;
    border-radius: 7px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
  }
  .design-file-name { font-weight: 600; }
  .design-file-sub { color: var(--text-dim); font-size: 12px; }

  /* ---- 创作输入（原型 .design-composer / .design-composer-input / .design-composer-actions） ---- */
  .design-composer {
    flex: none;
    margin: 0 16px 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-panel);
  }
  .design-composer-input {
    min-height: 40px;
    max-height: 120px;
    overflow-y: auto;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .design-composer-input:empty::before {
    content: attr(data-placeholder);
    color: var(--text-dim);
  }
  .design-composer-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .design-composer-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .design-composer-btn:hover { background: var(--bg-hover); color: var(--text); }
  .design-composer-send {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .design-composer-send:disabled { opacity: 0.4; cursor: default; }

  /* ---- 预览视图（原型 .design-preview-view / .dz-toolbar / .dz-mode-tab） ---- */
  .design-preview-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .dz-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .dz-toolbar-left { display: flex; align-items: center; gap: 8px; }
  .dz-mode {
    display: flex;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-panel);
  }
  .dz-mode-tab {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .dz-mode-tab.active { background: var(--accent-soft); color: var(--text); }
  .dz-viewport {
    flex: 1;
    overflow: auto;
    padding: 20px;
  }
  .dz-stage {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-panel);
  }
  .dz-source {
    flex: 1;
    margin: 0;
    padding: 16px;
    overflow: auto;
    color: var(--text-dim);
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre;
  }

  /* ---- toast（原型 .dz-toast） ---- */
  .dz-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 60;
    padding: 8px 16px;
    border-radius: 8px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    box-shadow: var(--menu-shadow);
    color: var(--text);
  }
</style>
</head>
<body>

  </div>
  </div>
  <pre class="dz-source" hidden="" id="dzSource" tabindex="0">&lt;section class="customer-summary"&gt;
  &lt;header&gt;&lt;h2&gt;客户档案&lt;/h2&gt;&lt;/header&gt;
&lt;/section&gt;</pre>
</div>
<!-- 历史恢复确认（原型 dzConfirm） -->
<div class="dz-confirm" hidden="" id="dzConfirm" style="position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)">
  <div style="background:var(--panel-1,#171a26);border:1px solid #262b3d;border-radius:12px;padding:20px;width:280px">
    <strong style="display:block;margin-bottom:8px">恢复到此版本？</strong>
    <p style="font-size:12px;color:var(--text-2,#9399b2);margin-bottom:16px" id="dzConfirmText">当前编辑将作为新版本保留，不会丢失。</p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="dz-menu-item" id="dzConfirmCancel" style="border:1px solid #262b3d;border-radius:8px" type="button">取消</button>
      <button class="dz-menu-item" id="dzConfirmOk" style="background:var(--accent,#2997ff);border-radius:8px;color:#fff" type="button">恢复</button>
    </div>
  </div>
</div>
<!-- 批注钉层 + 选框（原型 dzPinLayer/dzPickBox/dzToolHint/dzPickCard） -->
<div aria-label="批注钉层" hidden="" id="dzPinLayer" style="position:absolute;inset:0;z-index:20;pointer-events:none"></div>
<!-- 批注弹层（原型 dzNoteComposer，含发送到聊天） -->
<div aria-label="批注" class="dz-note-composer" hidden="" id="dzNoteComposer" role="dialog" style="position:absolute;z-index:25;right:12px;bottom:12px;width:280px;background:var(--panel-1,#171a26);border:1px solid #262b3d;border-radius:12px;padding:12px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <strong id="dzNoteTitle" style="font-size:13px">添加批注</strong>
    <span style="display:flex;gap:4px">
      <button aria-label="删除批注" hidden="" id="dzNoteDelete" type="button">🗑</button>
      <button aria-label="关闭" id="dzNoteClose" type="button">✕</button>
    </span>
  </div>
  <textarea id="dzNoteInput" placeholder="写批注…" style="width:100%;min-height:56px;background:transparent;border:1px solid #262b3d;border-radius:8px;padding:8px;color:var(--text,#e6e9f5);font:inherit;resize:vertical"></textarea>
  <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end">
    <button class="dz-menu-item" id="dzNoteSendChat" style="border:1px solid #262b3d;border-radius:8px" type="button">发给 AI</button>
    <button class="dz-menu-item" id="dzNoteSave" disabled="" style="background:var(--accent,#2997ff);border-radius:8px;color:#fff" type="button">保存</button>
  </div>
</div>
<!-- 画板工具（原型 dzDrawTools） -->
<div aria-label="标记工具" class="dz-draw-tools" hidden="" id="dzDrawTools" role="toolbar" style="position:absolute;z-index:22;top:52px;left:12px;display:flex;gap:6px;background:var(--panel-1,#171a26);border:1px solid #262b3d;border-radius:10px;padding:6px">
  <button aria-label="画笔" class="dz-draw-tool active" data-dz-draw="pen" type="button">✏️</button>
  <button aria-label="橡皮" class="dz-draw-tool" data-dz-draw="erase" type="button">🧽</button>
  <button aria-label="撤销笔画" id="dzDrawUndo" type="button">↶</button>
  <button aria-label="重做笔画" id="dzDrawRedo" type="button">↷</button>
  <button aria-label="把标记发给 AI" id="dzDrawSend" style="border-left:1px solid #262b3d;padding-left:6px" type="button">发给 AI</button>
</div>
<!-- 演示全屏层（原型 dzPresentLayer） -->
<div hidden="" id="dzPresentLayer" style="position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center">
  <span id="dzPresentTitle" style="position:absolute;top:16px;left:20px;color:#9399b2;font-size:12px"></span>
  <button aria-label="退出演示" id="dzPresentExit" style="position:absolute;top:12px;right:16px;background:#171a26;color:#e6e9f5;border:1px solid #262b3d;border-radius:8px;padding:6px 12px" type="button">退出演示</button>
  <iframe sandbox="" style="width:100%;height:100%;border:0;background:#fff" title="演示"></iframe>
</div>
<div class="dz-toast" hidden="" id="dzToast" role="status"></div>
<script>
(function () {
  "use strict";
  // 交互模式照原型：菜单开合、data-dz-toast、页签切换、composer 发送。
  var toast = document.getElementById("dzToast");
  var toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 2200);
  }

  // ---- 弹出菜单（plus / present / export）----
  var menus = [
    { btn: document.getElementById("dzPlusBtn"), menu: document.getElementById("dzPlusMenu") },
    { btn: document.getElementById("dzPresentBtn"), menu: document.getElementById("dzPresentMenu") },
    { btn: document.getElementById("dzExportBtn"), menu: document.getElementById("dzExportMenu") }
  ];
  function closeMenus(except) {
    menus.forEach(function (m) {
      if (m.menu !== except) {
        m.menu.hidden = true;
        m.btn.setAttribute("aria-expanded", "false");
      }
    });
  }
  menus.forEach(function (m) {
    m.btn.addEventListener("click", function (event) {
      event.stopPropagation();
      var willOpen = m.menu.hidden;
      closeMenus(m.menu);
      m.menu.hidden = !willOpen;
      m.btn.setAttribute("aria-expanded", String(!m.menu.hidden));
    });
  });
  document.addEventListener("click", function () { closeMenus(null); });
  document.addEventListener("click", function (event) {
    var exportTarget = event.target.closest("[data-dz-export]");
    if (exportTarget) {
      requestExport();
      closeMenus(null);
      return;
    }
    var target = event.target.closest("[data-dz-toast]");
    if (target) {
      showToast(target.getAttribute("data-dz-toast"));
      closeMenus(null);
    }
  });

  // ---- 版本历史：请求宿主拉真实版本列表（S4）----
  document.getElementById("dzHistoryBtn").addEventListener("click", function () {
    requestVersions();
  });

  // ---- 页签切换：files 视图 <-> preview 视图 ----
  var viewFiles = document.getElementById("dzViewFiles");
  var viewPreview = document.getElementById("dzViewPreview");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".design-ws-tab"));
  function selectTab(tab) {
    tabs.forEach(function (t) {
      var active = t === tab;
      t.classList.toggle("active", active);
      t.setAttribute("aria-selected", String(active));
    });
    var isFiles = tab.getAttribute("data-dz-view") === "files";
    viewFiles.hidden = !isFiles;
    viewPreview.hidden = isFiles;
    closeMenus(null);
  }
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function (event) {
      if (event.target.closest(".design-ws-x")) {
        // 关闭钮：切回文件视图（静态 mock，原型会移除标签）
        selectTab(tabs[0]);
        return;
      }
      selectTab(tab);
    });
  });
  document.querySelectorAll("[data-dz-open]").forEach(function (item) {
    item.addEventListener("click", function () {
      var file = item.getAttribute("data-dz-open");
      var fileTab = tabs.find(function (t) { return t.getAttribute("data-dz-file") === file; });
      if (fileTab) selectTab(fileTab);
      closeMenus(null);
    });
  });

  // ---- 预览 | 代码 切换 ----
  var viewport = document.getElementById("dzViewport");
  var source = document.getElementById("dzSource");
  document.querySelectorAll(".dz-mode-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".dz-mode-tab").forEach(function (t) {
        var active = t === tab;
        t.classList.toggle("active", active);
        t.setAttribute("aria-selected", String(active));
      });
      var isSource = tab.getAttribute("data-dz-mode") === "source";
      viewport.hidden = isSource;
      source.hidden = !isSource;
    });
  });

  // ---- S3 MessagePort 桥：宿主经 window "artemis:port" 事件递来端口 ----
  // 候选经 port 上行；宿主快照经 port 下行。仍不做任何 fetch/ipc/父窗口调用。
  var hostPort = null;
  window.addEventListener("message", function (event) {
    if (event.source === window && event.data === "artemis:port-init") {
      hostPort = event.ports[0] || null;
      if (hostPort) hostPort.start();
    }
  });


  // ---- S4：导出/版本历史经 port 请求宿主（宿主动作），下行快照驱动 UI ----
  var currentDocument = null; // { documentId, name, headRevision, versionCount }
  window.addEventListener("message", function (event) {
    if (event.source === window && event.data === "artemis:port-init") {
      hostPort = event.ports[0] || null;
      if (hostPort) hostPort.start();
      return;
    }
    if (event.source === window && event.data === "artemis:export-result") {
      showToast("已导出：" + (event.detail && event.detail.path));
    }
  });
  var previewStage = document.querySelector("#dzViewport .dz-stage");
  var sourcePane = document.getElementById("dzSource");
  function renderDocument(html, name, subtitle) {
    lastDocumentHtml = html;
    if (previewStage) {
      previewStage.innerHTML =
        '<div class="mock-head"><b></b><span></span></div>' +
        '<iframe style="width:100%;height:100%;border:0;background:#fff;border-radius:10px" sandbox=""></iframe>';
      var head = previewStage.querySelector(".mock-head");
      if (head) {
        head.querySelector("b").textContent = name || "设计文档";
        head.querySelector("span").textContent = subtitle || "";
      }
      var frame = previewStage.querySelector("iframe");
      if (frame) frame.srcdoc = html;
    }
    if (sourcePane) sourcePane.textContent = html || "";
  }
  function bindPortListener(port) {
    port.addEventListener("message", function (event) {
      var data = event.data || {};
      if (data.type === "snapshot" && data.snapshot) {
        var docs = data.snapshot.documents || [];
        currentDocument = docs.length ? docs[docs.length - 1] : null;
        if (currentDocument && hostPort) {
          hostPort.postMessage({
            type: "read-document-request",
            documentId: currentDocument.documentId,
          });
        }
      }
      if (data.type === "export-result" && data.path) {
        showToast("已导出：" + data.path);
      }
      if (data.type === "versions" && data.versions) {
        var out = JSON.parse(data.versions.output || "{}");
        var list = (out.versions || [])
          .map(function (v) { return "v" + v.sequence + " (" + v.revision.slice(0, 8) + ")"; })
          .join(" ← ");
        showToast(currentDocument ? currentDocument.name + "：" + list : list);
      }
      if (data.type === "document-html" && data.html) {
        renderDocument(data.html, data.name, data.subtitle);
      }
    });
  }
  window.addEventListener("artemis:port", function (event) {
    hostPort = event.ports && event.ports[0] ? event.ports[0] : null;
    if (hostPort) {
      hostPort.start();
      bindPortListener(hostPort);
    }
  });
  function requestExport() {
    if (!hostPort) { showToast("导出需要宿主连接"); return; }
    if (!currentDocument) { showToast("尚无可导出的文档"); return; }
    hostPort.postMessage({
      type: "export-request",
      documentId: currentDocument.documentId,
      revision: currentDocument.headRevision,
    });
    showToast("已请求宿主导出 " + currentDocument.name);
  }
  function requestVersions() {
    if (!hostPort) { showToast("版本历史（未连接宿主）"); return; }
    if (!currentDocument) { showToast("尚无文档版本"); return; }
    hostPort.postMessage({
      type: "list-versions-request",
      documentId: currentDocument.documentId,
    });
    showToast("已请求 " + currentDocument.name + " 的版本历史");
  }

  // ---- 创作输入：发送仅 dispatch candidate-prompt 事件，不做任何 fetch/ipc/父窗口调用 ----
  var composerInput = document.querySelector(".design-composer-input");
  var composerSend = document.getElementById("dzComposerSend");
  function syncSendState() {
    composerSend.disabled = composerInput.textContent.trim().length === 0;
  }
  composerInput.addEventListener("input", syncSendState);
  composerSend.addEventListener("click", function () {
    var text = composerInput.textContent.trim();
    if (!text) return;
    composerInput.dispatchEvent(
      new CustomEvent("artemis:candidate-prompt", {
        detail: { text: text, source: "panel" },
        bubbles: true
      })
    );
    // S3：候选经宿主递来的 MessagePort 上行（无 port 时退化为仅事件——
    // 独立打开面板的预览场景）。
    if (hostPort) hostPort.postMessage({ type: "candidate-prompt", text: text });
    composerInput.textContent = "";
    syncSendState();
    showToast("已发送到对话输入框");
  });

  // ================= S4 对齐补齐：原型交互全量 =================
  var lastDocumentHtml = "";

  function getPreviewFrame() {
    return previewStage ? previewStage.querySelector("iframe") : null;
  }

  // ---- A: dzReload 重载（重设 srcdoc）----
  document.getElementById("dzReload").addEventListener("click", function () {
    var frame = getPreviewFrame();
    if (frame && lastDocumentHtml) {
      frame.srcdoc = lastDocumentHtml;
      showToast("已重新加载");
    } else {
      showToast("暂无可重载的文档");
    }
  });

  // ---- A: 视口切换（device menu）----
  document.getElementById("dzDeviceBtn").addEventListener("click", function (event) {
    event.stopPropagation();
    var menu = document.getElementById("dzDeviceMenu");
    menu.hidden = !menu.hidden;
    this.setAttribute("aria-expanded", String(!menu.hidden));
  });
  document.querySelectorAll("[data-dz-device]").forEach(function (item) {
    item.addEventListener("click", function () {
      var id = item.getAttribute("data-dz-device");
      document.getElementById("dzDeviceLabel").textContent =
        id === "mobile" ? "手机" : id === "tablet" ? "平板" : "桌面端";
      document.getElementById("dzDeviceMenu").hidden = true;
      var frame = getPreviewFrame();
      if (frame) {
        frame.style.width = id === "mobile" ? "390px" : id === "tablet" ? "768px" : "100%";
        frame.style.margin = id === "desktop" ? "0" : "0 auto";
      }
    });
  });

  // ---- A: 缩放（zoom menu）----
  document.getElementById("dzZoomBtn").addEventListener("click", function (event) {
    event.stopPropagation();
    var menu = document.getElementById("dzZoomMenu");
    menu.hidden = !menu.hidden;
    this.setAttribute("aria-expanded", String(!menu.hidden));
  });
  document.querySelectorAll("[data-dz-zoom]").forEach(function (item) {
    item.addEventListener("click", function () {
      var level = item.getAttribute("data-dz-zoom");
      document.getElementById("dzZoomLabel").textContent = level + "%";
      document.getElementById("dzZoomMenu").hidden = true;
      var frame = getPreviewFrame();
      if (frame) {
        frame.style.transform = "scale(" + level / 100 + ")";
        frame.style.transformOrigin = "top center";
      }
    });
  });

  // ---- A: 截图（闪光 + 宿主请求）----
  document.getElementById("dzShotBtn").addEventListener("click", function () {
    var frame = getPreviewFrame();
    if (frame && hostPort && currentDocument) {
      hostPort.postMessage({
        type: "screenshot-request",
        documentId: currentDocument.documentId,
      });
    }
    var flash = document.createElement("div");
    flash.style.cssText = "position:absolute;inset:0;background:#fff;opacity:.7;transition:opacity .3s;pointer-events:none;z-index:50";
    (viewport || document.body).appendChild(flash);
    setTimeout(function () { flash.style.opacity = "0"; }, 60);
    setTimeout(function () { flash.remove(); }, 400);
    showToast("已请求宿主截图");
  });

  // ---- B: 历史项点击 → 确认弹层 → port restore 请求 ----
  var pendingRestoreRevision = null;
  document.querySelectorAll("#dzHistory .dz-history-item").forEach(function (item) {
    item.addEventListener("click", function () {
      document.querySelectorAll("#dzHistory .dz-history-item").forEach(function (o) { o.classList.remove("active"); });
      item.classList.add("active");
      pendingRestoreRevision = item.getAttribute("data-dz-revision") || null;
      document.getElementById("dzConfirm").hidden = false;
    });
  });
  document.getElementById("dzConfirmCancel").addEventListener("click", function () {
    document.getElementById("dzConfirm").hidden = true;
  });
  document.getElementById("dzConfirmOk").addEventListener("click", function () {
    document.getElementById("dzConfirm").hidden = true;
    document.getElementById("dzHistory").hidden = true;
    if (pendingRestoreRevision && hostPort && currentDocument) {
      hostPort.postMessage({
        type: "restore-request",
        documentId: currentDocument.documentId,
        revision: pendingRestoreRevision,
      });
      showToast("已请求恢复到 " + pendingRestoreRevision.slice(0, 8));
    }
    pendingRestoreRevision = null;
  });

  // ---- B: 批注（弹层 → 保存钉子；发给 AI → 候选）----
  var annotations = [];
  var dzNoteComposer = document.getElementById("dzNoteComposer");
  var dzNoteInput = document.getElementById("dzNoteInput");
  var dzNoteSave = document.getElementById("dzNoteSave");
  var dzPinLayer = document.getElementById("dzPinLayer");
  function syncNoteButtons() {
    dzNoteSave.disabled = dzNoteInput.value.trim().length === 0;
  }
  dzNoteInput.addEventListener("input", syncNoteButtons);
  dzNoteInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !dzNoteSave.disabled) dzNoteSave.click();
  });
  document.getElementById("dzNoteClose").addEventListener("click", function () {
    dzNoteComposer.hidden = true;
  });
  dzNoteSave.addEventListener("click", function () {
    var text = dzNoteInput.value.trim();
    if (!text) return;
    var pin = document.createElement("div");
    pin.title = text;
    pin.style.cssText = "position:absolute;width:18px;height:18px;border-radius:50% 50% 50% 0;background:var(--accent,#2997ff);transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:auto";
    pin.style.left = (20 + Math.random() * 200) + "px";
    pin.style.top = (30 + Math.random() * 160) + "px";
    pin.addEventListener("click", function () {
      dzNoteInput.value = text;
      dzNoteComposer.hidden = false;
      syncNoteButtons();
    });
    dzPinLayer.appendChild(pin);
    annotations.push({ text: text });
    dzNoteInput.value = "";
    dzNoteComposer.hidden = true;
    showToast("批注已保存（" + annotations.length + " 条）");
  });
  document.getElementById("dzNoteSendChat").addEventListener("click", function () {
    var text = dzNoteInput.value.trim();
    if (!text) return;
    composerInput.dispatchEvent(
      new CustomEvent("artemis:candidate-prompt", {
        detail: { text: text, source: "panel" },
        bubbles: true
      })
    );
    if (hostPort) hostPort.postMessage({ type: "candidate-prompt", text: text });
    dzNoteInput.value = "";
    dzNoteComposer.hidden = true;
    showToast("批注已作为候选发送");
  });

  // ---- C: 画板（canvas 手绘 + 撤销重做 + 发给 AI）----
  var drawBtn = document.createElement("button");
  drawBtn.className = "dz-iconbtn";
  drawBtn.id = "dzDrawBtn";
  drawBtn.type = "button";
  drawBtn.title = "画板标记";
  drawBtn.textContent = "✏️";
  document.querySelector(".dz-toolbar-right").appendChild(drawBtn);
  var drawCanvas = null;
  var drawCtx = null;
  var drawStrokes = [];
  var undoneStrokes = [];
  var drawActive = false;
  function ensureDrawCanvas() {
    if (drawCanvas) return;
    drawCanvas = document.createElement("canvas");
    drawCanvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;z-index:21;pointer-events:auto";
    drawCtx = drawCanvas.getContext("2d");
    var stage = previewStage || document.getElementById("dzViewport");
    stage.style.position = "relative";
    stage.appendChild(drawCanvas);
    var drawing = false;
    function pos(e) {
      var rect = drawCanvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    drawCanvas.addEventListener("pointerdown", function (e) {
      drawing = true;
      undoneStrokes = [];
      drawStrokes.push({ points: [pos(e)] });
    });
    drawCanvas.addEventListener("pointermove", function (e) {
      if (!drawing) return;
      drawStrokes[drawStrokes.length - 1].points.push(pos(e));
      drawCanvas.redraw();
    });
    window.addEventListener("pointerup", function () { drawing = false; });
    drawCanvas.redraw = function () {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.strokeStyle = "#ff5c5c";
      drawCtx.lineWidth = 2.5;
      drawCtx.lineCap = "round";
      drawStrokes.forEach(function (s) {
        drawCtx.beginPath();
        s.points.forEach(function (p, i) { if (i) drawCtx.lineTo(p.x, p.y); else drawCtx.moveTo(p.x, p.y); });
        drawCtx.stroke();
      });
    };
  }
  drawBtn.addEventListener("click", function () {
    drawActive = !drawActive;
    drawBtn.classList.toggle("active", drawActive);
    document.getElementById("dzDrawTools").hidden = !drawActive;
    if (drawActive) { ensureDrawCanvas(); drawCanvas.style.display = "block"; }
    else if (drawCanvas) drawCanvas.style.display = "none";
  });
  document.getElementById("dzDrawUndo").addEventListener("click", function () {
    if (drawStrokes.length) { undoneStrokes.push(drawStrokes.pop()); if (drawCanvas) drawCanvas.redraw(); }
  });
  document.getElementById("dzDrawRedo").addEventListener("click", function () {
    if (undoneStrokes.length) { drawStrokes.push(undoneStrokes.pop()); if (drawCanvas) drawCanvas.redraw(); }
  });
  document.getElementById("dzDrawSend").addEventListener("click", function () {
    var text = "请根据画板标记修改设计（共 " + drawStrokes.length + " 处标记）";
    composerInput.dispatchEvent(new CustomEvent("artemis:candidate-prompt", { detail: { text: text, source: "panel" }, bubbles: true }));
    if (hostPort) hostPort.postMessage({ type: "candidate-prompt", text: text });
    showToast("标记已作为候选发送");
  });

  // ---- C: 演示层（全屏 iframe + 退出）----
  function enterPresent() {
    var layer = document.getElementById("dzPresentLayer");
    layer.querySelector("iframe").srcdoc = lastDocumentHtml || "";
    document.getElementById("dzPresentTitle").textContent =
      (currentDocument ? currentDocument.name : "设计文档") + " · 演示中";
    layer.hidden = false;
  }
  document.querySelectorAll("#dzPresentMenu .dz-menu-item").forEach(function (item) {
    item.addEventListener("click", function () { enterPresent(); });
  });
  document.getElementById("dzPresentExit").addEventListener("click", function () {
    document.getElementById("dzPresentLayer").hidden = true;
  });

  // ---- C: 分享钮（动作区尾部）----
  var shareBtn = document.createElement("button");
  shareBtn.className = "design-ws-iconbtn";
  shareBtn.id = "dzShareBtn";
  shareBtn.type = "button";
  shareBtn.title = "分享";
  shareBtn.textContent = "分享";
  shareBtn.style.cssText = "font-size:12px;padding:0 8px";
  shareBtn.addEventListener("click", function () {
    var shared = shareBtn.classList.toggle("shared");
    shareBtn.textContent = shared ? "已分享" : "分享";
    showToast(shared ? "分享已开启（本机演示）" : "分享已关闭");
  });
  document.querySelector(".design-ws-actions").appendChild(shareBtn);
})();
</script>
</body>
</html>
