<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'"
    />
    <title>Artemis License Issuer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="issuer.css" />
  </head>
  <body>
    <main>
      <div class="brand">ARTEMIS · PRIVATE ISSUER</div>
      <h1>离线许可证签发</h1>
      <p class="muted">
        此工具仅供签发者使用。私钥不能放入 Artemis 安装包，也不能发送给用户。
      </p>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">
        正在初始化注册机…
      </p>
      <label for="password">私钥口令</label
      ><input
        id="password"
        type="password"
        autocomplete="off"
        maxlength="1024"
        placeholder="新建口令至少 12 个字符"
      />
      <div class="row">
        <button data-action="unlock">打开并解锁私钥</button
        ><button data-action="create">创建新私钥</button
        ><button data-action="lock">锁定</button>
      </div>
      <p id="key" class="muted">私钥未解锁</p>
      <button data-action="public">导出构建公钥配置</button
      ><label for="device">用户机器码</label
      ><input id="device" placeholder="AM1-…" maxlength="68" /><label
        for="expiry"
        >授权截止时间（本机时区）</label
      ><input id="expiry" type="datetime-local" step="1" />
      <p id="timezone" class="muted"></p>
      <button class="primary" id="issue">生成注册码</button
      ><label for="output">生成结果</label
      ><textarea id="output" rows="3" readonly></textarea>
      <div class="row">
        <button data-action="copy">复制</button
        ><button data-action="export">导出许可证文件</button>
      </div>
      <details>
        <summary>签发时间异常恢复凭证</summary>
        <p class="muted">
          确认用户已校正电脑时间，再粘贴用户的恢复请求。凭证 24
          小时内可用，每个请求只能恢复一次；不会延长原许可证期限。
        </p>
        <textarea
          id="request"
          rows="3"
          maxlength="4096"
          placeholder='{"device":"AM1-…","challenge":"…"}'
        ></textarea
        ><button id="recover">生成恢复凭证</button>
      </details>
    </main>
    <script src="ui.js"></script>
  </body>
</html>
