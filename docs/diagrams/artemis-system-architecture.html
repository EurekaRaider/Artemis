<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artemis 系统架构</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --paper: #f7f7f6;
        --paper-2: #f0f0ef;
        --ink: #1f2023;
        --muted: #6e7279;
        --soft: #93969c;
        --rule: #d8d8d5;
        --accent: #326fcb;
        --accent-tint: rgba(50, 111, 203, 0.08);
        --link: #1264a3;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-serif: "Instrument Serif", Georgia, serif;
        --font-mono:
          ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-sans);
        min-height: 100vh;
        padding: 32px;
      }
      .frame {
        margin: 0 auto;
        max-width: 1400px;
        min-width: 960px;
        width: 100%;
      }
      .eyebrow {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.16em;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      h1 {
        color: var(--ink);
        font-family: var(--font-serif);
        font-size: 32px;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.12;
        margin-bottom: 24px;
      }
      svg {
        display: block;
        min-width: 960px;
        width: 100%;
      }
      .zone {
        fill: rgba(31, 32, 35, 0.02);
        stroke: rgba(31, 32, 35, 0.14);
        stroke-width: 1;
      }
      .zone-label {
        fill: var(--muted);
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.14em;
      }
      .node-mask {
        fill: var(--paper);
      }
      .node {
        fill: #ffffff;
        stroke: var(--ink);
        stroke-width: 1;
      }
      .node.focal {
        fill: var(--accent-tint);
        stroke: var(--accent);
        stroke-width: 1.2;
      }
      .node.store {
        fill: rgba(31, 32, 35, 0.05);
        stroke: var(--muted);
      }
      .node.external {
        fill: rgba(31, 32, 35, 0.03);
        stroke: rgba(31, 32, 35, 0.32);
      }
      .tag {
        fill: transparent;
        stroke: rgba(31, 32, 35, 0.34);
        stroke-width: 0.8;
      }
      .tag.focal {
        stroke: rgba(50, 111, 203, 0.62);
      }
      .tag-text {
        fill: var(--muted);
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .tag-text.focal {
        fill: var(--accent);
      }
      .node-name {
        fill: var(--ink);
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 600;
      }
      .node-sub {
        fill: var(--muted);
        font-family: var(--font-mono);
        font-size: 8px;
      }
      .flow {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.2;
      }
      .flow.return {
        stroke-dasharray: 4 4;
        stroke-width: 1;
      }
      .flow.link {
        stroke: var(--link);
      }
      .arrow-mask {
        fill: var(--paper);
      }
      .arrow-label {
        fill: var(--muted);
        font-family: var(--font-mono);
        font-size: 8px;
        letter-spacing: 0.06em;
      }
      .arrow-label.link {
        fill: var(--link);
      }
      .legend-text {
        fill: var(--muted);
        font-family: var(--font-mono);
        font-size: 8px;
      }
      .legend-head {
        fill: var(--muted);
        font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.14em;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <p class="eyebrow">ARCHITECTURE · DOC-WIDE · CURRENT IMPLEMENTATION</p>
      <h1>Artemis 系统架构</h1>

      <svg
        viewBox="0 0 1280 720"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="artemis-system-architecture-title artemis-system-architecture-desc"
      >
        <title id="artemis-system-architecture-title">Artemis 系统架构</title>
        <desc id="artemis-system-architecture-desc">
          展示沙箱化 React 渲染器经类型化 Preload 进入 Electron Main，再与独立
          Pi Agent Host utility process、唯一 Pi agent
          loop、模型服务、项目与临时工作区执行面和本地持久化交互的当前架构。
        </desc>
        <defs>
          <marker
            id="arch-arrow"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <polygon points="0 0, 8 4, 0 8" fill="#6e7279" />
          </marker>
          <marker
            id="arch-arrow-link"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <polygon points="0 0, 8 4, 0 8" fill="#1264a3" />
          </marker>
          <marker
            id="arch-arrow-accent"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <polygon points="0 0, 8 4, 0 8" fill="#326fcb" />
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f7f7f6" />

        <!-- Tier and process zones -->
        <rect class="zone" x="40" y="96" width="384" height="424" rx="8" />
        <rect x="56" y="100" width="160" height="16" rx="4" fill="#f7f7f6" />
        <text class="zone-label" x="64" y="112">DESKTOP FRONT END</text>

        <rect class="zone" x="456" y="96" width="200" height="424" rx="8" />
        <rect x="472" y="100" width="136" height="16" rx="4" fill="#f7f7f6" />
        <text class="zone-label" x="480" y="112">CONTROL PLANE</text>

        <rect class="zone" x="688" y="96" width="352" height="424" rx="8" />
        <rect x="704" y="100" width="184" height="16" rx="4" fill="#f7f7f6" />
        <text class="zone-label" x="712" y="112">AGENT UTILITY PROCESS</text>

        <!-- Connectors paint before nodes -->
        <line
          class="flow"
          x1="216"
          y1="248"
          x2="248"
          y2="248"
          marker-end="url(#arch-arrow)"
        />
        <line
          class="flow"
          x1="392"
          y1="248"
          x2="484"
          y2="248"
          marker-end="url(#arch-arrow)"
        />
        <line
          class="flow"
          x1="628"
          y1="248"
          x2="720"
          y2="248"
          marker-end="url(#arch-arrow)"
        />
        <line
          class="flow"
          x1="848"
          y1="248"
          x2="880"
          y2="248"
          marker-end="url(#arch-arrow-accent)"
        />
        <line
          class="flow link"
          x1="1008"
          y1="248"
          x2="1080"
          y2="248"
          marker-end="url(#arch-arrow-link)"
        />
        <line
          class="flow"
          x1="944"
          y1="296"
          x2="944"
          y2="384"
          marker-end="url(#arch-arrow)"
        />
        <path
          class="flow return"
          d="M 1008 432 H 1048 Q 1056 432 1056 440 V 536 Q 1056 544 1048 544 H 676 Q 668 544 668 536 V 280 Q 668 272 660 272 H 628"
          marker-end="url(#arch-arrow)"
        />
        <line
          class="flow"
          x1="784"
          y1="296"
          x2="784"
          y2="384"
          marker-end="url(#arch-arrow)"
        />
        <line
          class="flow"
          x1="556"
          y1="296"
          x2="556"
          y2="384"
          marker-end="url(#arch-arrow)"
        />

        <!-- Arrow labels with clear connector gaps -->
        <rect
          class="arrow-mask"
          x="420"
          y="228"
          width="36"
          height="12"
          rx="4"
        />
        <text class="arrow-label" x="438" y="236" text-anchor="middle">
          IPC
        </text>

        <rect
          class="arrow-mask"
          x="648"
          y="228"
          width="52"
          height="12"
          rx="4"
        />
        <text class="arrow-label" x="674" y="236" text-anchor="middle">
          COMMAND
        </text>

        <rect
          class="arrow-mask"
          x="1016"
          y="228"
          width="56"
          height="12"
          rx="4"
        />
        <text class="arrow-label link" x="1044" y="236" text-anchor="middle">
          MODEL API
        </text>

        <rect
          class="arrow-mask"
          x="960"
          y="328"
          width="52"
          height="16"
          rx="4"
        />
        <text class="arrow-label" x="986" y="340" text-anchor="middle">
          RAW PI
        </text>

        <rect
          class="arrow-mask"
          x="836"
          y="524"
          width="48"
          height="12"
          rx="4"
        />
        <text class="arrow-label" x="860" y="532" text-anchor="middle">
          EVENTS
        </text>

        <rect
          class="arrow-mask"
          x="708"
          y="328"
          width="56"
          height="16"
          rx="4"
        />
        <text class="arrow-label" x="736" y="340" text-anchor="middle">
          BROKER
        </text>

        <rect
          class="arrow-mask"
          x="476"
          y="328"
          width="60"
          height="16"
          rx="4"
        />
        <text class="arrow-label" x="506" y="340" text-anchor="middle">
          PERSIST
        </text>

        <!-- React Renderer -->
        <rect class="node-mask" x="72" y="200" width="144" height="96" rx="8" />
        <rect class="node" x="72" y="200" width="144" height="96" rx="8" />
        <rect class="tag" x="84" y="212" width="68" height="16" rx="4" />
        <text class="tag-text" x="118" y="224" text-anchor="middle">
          RENDERER
        </text>
        <text class="node-name" x="144" y="252" text-anchor="middle">
          React UI
        </text>
        <text class="node-sub" x="144" y="272" text-anchor="middle">
          sandboxed · no Node
        </text>

        <!-- Preload -->
        <rect
          class="node-mask"
          x="248"
          y="200"
          width="144"
          height="96"
          rx="8"
        />
        <rect class="node" x="248" y="200" width="144" height="96" rx="8" />
        <rect class="tag" x="260" y="212" width="52" height="16" rx="4" />
        <text class="tag-text" x="286" y="224" text-anchor="middle">
          BRIDGE
        </text>
        <text class="node-name" x="320" y="252" text-anchor="middle">
          Typed Preload
        </text>
        <text class="node-sub" x="320" y="272" text-anchor="middle">
          ArtemisApi only
        </text>

        <!-- Electron Main -->
        <rect
          class="node-mask"
          x="484"
          y="200"
          width="144"
          height="96"
          rx="8"
        />
        <rect class="node" x="484" y="200" width="144" height="96" rx="8" />
        <rect class="tag" x="496" y="212" width="40" height="16" rx="4" />
        <text class="tag-text" x="516" y="224" text-anchor="middle">MAIN</text>
        <text class="node-name" x="556" y="252" text-anchor="middle">
          Electron Main
        </text>
        <text class="node-sub" x="556" y="272" text-anchor="middle">
          policy · IPC · lifecycle
        </text>

        <!-- Local state -->
        <rect
          class="node-mask"
          x="484"
          y="384"
          width="144"
          height="96"
          rx="8"
        />
        <rect
          class="node store"
          x="484"
          y="384"
          width="144"
          height="96"
          rx="8"
        />
        <rect class="tag" x="496" y="396" width="44" height="16" rx="4" />
        <text class="tag-text" x="518" y="408" text-anchor="middle">STORE</text>
        <text class="node-name" x="556" y="436" text-anchor="middle">
          Local State
        </text>
        <text class="node-sub" x="556" y="456" text-anchor="middle">
          SQLite · safeStorage
        </text>
        <text class="node-sub" x="556" y="472" text-anchor="middle">
          project + temp workspaces
        </text>

        <!-- Agent Host -->
        <rect
          class="node-mask"
          x="720"
          y="200"
          width="128"
          height="96"
          rx="8"
        />
        <rect class="node" x="720" y="200" width="128" height="96" rx="8" />
        <rect class="tag" x="732" y="212" width="44" height="16" rx="4" />
        <text class="tag-text" x="754" y="224" text-anchor="middle">HOST</text>
        <text class="node-name" x="784" y="252" text-anchor="middle">
          Pi Agent Host
        </text>
        <text class="node-sub" x="784" y="272" text-anchor="middle">
          sessions · JSONL
        </text>

        <!-- Pi SDK focal -->
        <rect
          class="node-mask"
          x="880"
          y="200"
          width="128"
          height="96"
          rx="8"
        />
        <rect
          class="node focal"
          x="880"
          y="200"
          width="128"
          height="96"
          rx="8"
        />
        <rect class="tag focal" x="892" y="212" width="28" height="16" rx="4" />
        <text class="tag-text focal" x="906" y="224" text-anchor="middle">
          PI
        </text>
        <text class="node-name" x="944" y="252" text-anchor="middle">
          Pi SDK
        </text>
        <text class="node-sub" x="944" y="272" text-anchor="middle">
          only agent loop · cache
        </text>

        <!-- Execution surfaces -->
        <rect
          class="node-mask"
          x="720"
          y="384"
          width="128"
          height="96"
          rx="8"
        />
        <rect class="node" x="720" y="384" width="128" height="96" rx="8" />
        <rect class="tag" x="732" y="396" width="40" height="16" rx="4" />
        <text class="tag-text" x="752" y="408" text-anchor="middle">TOOLS</text>
        <text class="node-name" x="784" y="432" text-anchor="middle">
          Execution
        </text>
        <text class="node-sub" x="784" y="452" text-anchor="middle">
          workspace · Shell · MCP
        </text>
        <text class="node-sub" x="784" y="468" text-anchor="middle">
          extensions · team
        </text>

        <!-- PiAdapter -->
        <rect
          class="node-mask"
          x="880"
          y="384"
          width="128"
          height="96"
          rx="8"
        />
        <rect class="node" x="880" y="384" width="128" height="96" rx="8" />
        <rect class="tag" x="892" y="396" width="64" height="16" rx="4" />
        <text class="tag-text" x="924" y="408" text-anchor="middle">
          PROTOCOL
        </text>
        <text class="node-name" x="944" y="436" text-anchor="middle">
          PiAdapter
        </text>
        <text class="node-sub" x="944" y="456" text-anchor="middle">
          versioned UI events
        </text>

        <!-- Provider -->
        <rect
          class="node-mask"
          x="1080"
          y="200"
          width="160"
          height="96"
          rx="8"
        />
        <rect
          class="node external"
          x="1080"
          y="200"
          width="160"
          height="96"
          rx="8"
        />
        <rect class="tag" x="1092" y="212" width="64" height="16" rx="4" />
        <text class="tag-text" x="1124" y="224" text-anchor="middle">
          EXTERNAL
        </text>
        <text class="node-name" x="1160" y="252" text-anchor="middle">
          Model Provider
        </text>
        <text class="node-sub" x="1160" y="272" text-anchor="middle">
          Responses / Chat
        </text>

        <!-- Legend strip -->
        <line
          x1="40"
          y1="656"
          x2="1240"
          y2="656"
          stroke="rgba(31,32,35,0.12)"
          stroke-width="0.8"
        />
        <text class="legend-head" x="40" y="680">LEGEND</text>
        <line
          class="flow"
          x1="144"
          y1="676"
          x2="184"
          y2="676"
          marker-end="url(#arch-arrow)"
        />
        <text class="legend-text" x="196" y="680">internal control / data</text>
        <line
          class="flow link"
          x1="404"
          y1="676"
          x2="444"
          y2="676"
          marker-end="url(#arch-arrow-link)"
        />
        <text class="legend-text" x="456" y="680">provider network call</text>
        <rect
          x="676"
          y="668"
          width="36"
          height="16"
          rx="4"
          fill="rgba(31,32,35,0.02)"
          stroke="rgba(31,32,35,0.20)"
          stroke-width="0.8"
        />
        <text class="legend-text" x="724" y="680">tier / process zone</text>
        <rect
          x="916"
          y="668"
          width="36"
          height="16"
          rx="4"
          fill="rgba(31,32,35,0.05)"
          stroke="#6e7279"
          stroke-width="0.8"
        />
        <text class="legend-text" x="964" y="680">durable local state</text>
      </svg>
    </main>
  </body>
</html>
