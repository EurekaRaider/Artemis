<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Native groups, independent computers</title>
    <style>
      body {
        margin: 0;
        background: #f5f5f7;
      }
      main {
        max-width: 1280px;
        margin: auto;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1280 840"
        role="img"
        aria-labelledby="artemis-im-collaboration-title artemis-im-collaboration-desc"
      >
        <title id="artemis-im-collaboration-title">
          Native groups, independent computers
        </title>
        <desc id="artemis-im-collaboration-desc">
          Two independent Artemis computers exchange work through a native IM
          group, each enforcing its own project permissions; automatic
          delegation requires owner authorization and an IM round-trip probe.
        </desc>
        <defs>
          <style>
            text {
              font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              fill: #1d1d1f;
            }
            .title {
              font-size: 34px;
              font-weight: 650;
              letter-spacing: -0.6px;
            }
            .sub {
              font-size: 17px;
              fill: #5a5a60;
            }
            .name {
              font-size: 21px;
              font-weight: 600;
            }
            .body {
              font-size: 16px;
              fill: #5a5a60;
            }
            .tag {
              font-size: 12px;
              letter-spacing: 1.2px;
              fill: #5a5a60;
              font-weight: 600;
            }
            .node {
              fill: #fff;
              stroke: #b9b9be;
              stroke-width: 1.2;
            }
            .focal {
              fill: #e4effb;
              stroke: #0071e3;
              stroke-width: 1.5;
            }
            .zone {
              fill: #ececee;
              fill-opacity: 0.45;
              stroke: #b9b9be;
              stroke-dasharray: 5 5;
            }
            .edge {
              fill: none;
              stroke: #5a5a60;
              stroke-width: 1.6;
              marker-end: url(#artemis-im-collaboration-arrow);
            }
            .network {
              stroke: #0071e3;
              marker-end: url(#artemis-im-collaboration-blue);
            }
            .label {
              font-size: 13px;
              fill: #5a5a60;
            }
            .rule {
              stroke: #c9c9ce;
              stroke-width: 1;
            }
          </style>
          <marker
            id="artemis-im-collaboration-arrow"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <path d="M0 0 8 4 0 8Z" fill="#5a5a60" />
          </marker>
          <marker
            id="artemis-im-collaboration-blue"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <path d="M0 0 8 4 0 8Z" fill="#0071e3" />
          </marker>
        </defs>
        <rect width="1280" height="840" fill="#f5f5f7" />
        <text x="40" y="44" class="tag">ARTEMIS / 1.6.0 · CURRENT SOURCE</text>
        <text x="40" y="92" class="title">
          Native groups, independent computers
        </text>
        <text x="40" y="128" class="sub">
          Connect independent bots to one native group; authorize each computer
          separately.
        </text>
        <rect x="24" y="184" width="352" height="448" rx="12" class="zone" />
        <text x="44" y="212" class="tag">COMPUTER A / OWNER A</text>
        <rect x="904" y="184" width="352" height="448" rx="12" class="zone" />
        <text x="924" y="212" class="tag">COMPUTER B / OWNER B</text>
        <path d="M200 372 V440" class="edge" />
        <path d="M1080 372 V440" class="edge" />
        <path d="M360 288 H452" class="edge network" />
        <rect x="389.0" y="253" width="30" height="21" fill="#f5f5f7" />
        <text x="404" y="268" class="label" text-anchor="middle">IM</text>
        <path d="M828 288 H920" class="edge network" />
        <rect x="859.0" y="253" width="30" height="21" fill="#f5f5f7" />
        <text x="874" y="268" class="label" text-anchor="middle">IM</text>
        <path d="M920 340 H828" class="edge network" stroke-dasharray="5 4" />
        <path d="M452 340 H360" class="edge network" stroke-dasharray="5 4" />
        <rect x="40" y="240" width="320" height="132" rx="8" class="node" />
        <text x="60" y="276" class="name">Local Gateway + bot A</text>
        <text x="60" y="308" class="body">
          Own bot identity and credentials
        </text>
        <text x="60" y="332" class="body">
          Durable inbox, outbox and receipts
        </text>
        <text x="60" y="356" class="body">
          Verified peers + permitted senders
        </text>
        <rect x="452" y="240" width="376" height="132" rx="8" class="focal" />
        <text x="472" y="276" class="name">One native group / channel</text>
        <text x="472" y="308" class="body">Slack or Feishu / Lark</text>
        <text x="472" y="332" class="body">
          Assignments, progress and results
        </text>
        <text x="472" y="356" class="body">
          Real platform identities and @mentions
        </text>
        <rect x="920" y="240" width="320" height="132" rx="8" class="node" />
        <text x="940" y="276" class="name">Local Gateway + bot B</text>
        <text x="940" y="308" class="body">
          Own bot identity and credentials
        </text>
        <text x="940" y="332" class="body">
          Durable inbox, outbox and receipts
        </text>
        <text x="940" y="356" class="body">
          Verified peers + permitted senders
        </text>
        <rect x="40" y="440" width="320" height="156" rx="8" class="node" />
        <text x="60" y="476" class="name">Artemis + Pi</text>
        <text x="60" y="508" class="body">Owner A’s group project grant</text>
        <text x="60" y="532" class="body">
          Read / write / command / network
        </text>
        <text x="60" y="556" class="body">Durable waits + continuation</text>
        <text x="60" y="580" class="body">Private owner approvals</text>
        <rect x="920" y="440" width="320" height="156" rx="8" class="node" />
        <text x="940" y="476" class="name">Artemis + Pi</text>
        <text x="940" y="508" class="body">Owner B’s group project grant</text>
        <text x="940" y="532" class="body">
          Read / write / command / network
        </text>
        <text x="940" y="556" class="body">Independent task + session</text>
        <text x="940" y="580" class="body">Private owner approvals</text>
        <text x="480" y="440" class="tag">BEFORE AUTOMATIC DELEGATION</text>
        <text x="480" y="476" class="body">
          Owner permission + IM round-trip proof
        </text>
        <text x="480" y="508" class="body">Otherwise: manual @ assignment</text>
        <text x="480" y="564" class="body">
          Sent cancellation ≠ peer confirmation
        </text>
        <text x="480" y="592" class="body">
          Timeout / missing heartbeat = unknown
        </text>
        <text x="40" y="672" class="tag">PRIVATE OWNER CHAT</text>
        <text x="40" y="704" class="body">
          Paired owner → local Execute tools and automatic approvals, including
          projectless temporary chats.
        </text>
        <path d="M40 736 H1240" class="rule" />
        <text x="40" y="772" class="body">
          Group work retains project, path, command and network grants.
          Approvals stay with each owner.
        </text>
        <text x="40" y="812" class="label">
          Solid: assignment / execution · Dashed: results and receipts · Dashed
          frames: independently authorized computers
        </text>
      </svg>
    </main>
  </body>
</html>
