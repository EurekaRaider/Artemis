<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artemis IM collaboration</title>
    <style>
      body {
        margin: 0;
        background: #f5f5f7;
      }
      main {
        max-width: 1440px;
        margin: auto;
        padding: 24px;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1280 560"
        role="img"
        aria-labelledby="artemis-im-title artemis-im-desc"
      >
        <title id="artemis-im-title">
          IM collaboration, with each computer in control
        </title>
        <desc id="artemis-im-desc">
          Existing WeCom, Feishu, Lark and Slack groups connect through an
          optional Gateway. Each paired Artemis desktop checks its owner's
          project permissions before Pi executes. Only public task messages and
          results are shared; approvals remain private and files require
          explicit publication.
        </desc>
        <defs>
          <marker
            id="im-arrow"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <path d="M0 0 8 4 0 8Z" fill="#0071e3" />
          </marker>
          <style>
            text {
              font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              fill: #1d1d1f;
            }
            .title {
              font-size: 32px;
              font-weight: 600;
            }
            .name {
              font-size: 20px;
              font-weight: 600;
            }
            .body {
              font-size: 16px;
              fill: #5a5a60;
            }
            .tag {
              font-size: 12px;
              fill: #5a5a60;
              letter-spacing: 1px;
            }
            .node {
              fill: #fff;
              stroke: #68686c;
            }
            .flow {
              fill: none;
              stroke: #0071e3;
              stroke-width: 2;
              marker-end: url(#im-arrow);
            }
          </style>
        </defs>
        <rect width="1280" height="560" fill="#f5f5f7" />
        <text x="40" y="60" class="title">
          IM collaboration, with each computer in control
        </text>
        <text x="40" y="96" class="body">
          One shared space. Existing groups. Independently authorized Artemis
          devices.
        </text>
        <text x="40" y="152" class="tag">EXISTING IM PLATFORMS</text>
        <text x="464" y="152" class="tag">OPTIONAL SHARED SERVICE</text>
        <text x="896" y="152" class="tag">EACH MEMBER'S COMPUTER</text>
        <path d="M344 240 H448" class="flow" />
        <path d="M792 240 H880" class="flow" />
        <path
          d="M1008 344 V384 Q1008 392 1000 392 H200 Q192 392 192 384 V344"
          class="flow"
          stroke-dasharray="4 4"
        />
        <rect x="360" y="204" width="72" height="24" fill="#f5f5f7" />
        <text x="396" y="220" text-anchor="middle" class="tag">TASKS</text>
        <rect x="804" y="204" width="64" height="24" fill="#f5f5f7" />
        <text x="836" y="220" text-anchor="middle" class="tag">PULL</text>
        <rect x="40" y="176" width="304" height="168" rx="8" class="node" />
        <text x="64" y="216" class="name">Groups &amp; private bot chats</text>
        <text x="64" y="252" class="body">WeCom · Feishu / Lark · Slack</text>
        <text x="64" y="284" class="body">
          Paired identities + group confirmation
        </text>
        <text x="64" y="316" class="body">
          Mention the bot or choose a member
        </text>
        <rect
          x="448"
          y="176"
          width="344"
          height="168"
          rx="8"
          fill="#e4effb"
          stroke="#0071e3"
        />
        <text x="472" y="216" class="name">Artemis Gateway</text>
        <text x="472" y="252" class="body">
          Space routing + durable delivery
        </text>
        <text x="472" y="284" class="body">
          Device leases + expiry + revocation
        </text>
        <text x="472" y="316" class="body">
          No model execution or local model keys
        </text>
        <rect x="880" y="176" width="360" height="168" rx="8" class="node" />
        <text x="904" y="216" class="name">Desktop → Pi Agent Host</text>
        <text x="904" y="252" class="body">
          Recheck owner, project and space grants
        </text>
        <text x="904" y="284" class="body">
          Scoped files + command/network controls
        </text>
        <text x="904" y="316" class="body">
          Local group conversation + member roster
        </text>
        <rect x="416" y="356" width="400" height="24" fill="#f5f5f7" />
        <text x="616" y="372" text-anchor="middle" class="body">
          Public task progress and results → linked groups
        </text>
        <path d="M40 432 H1240" stroke="#000" stroke-opacity="0.12" />
        <text x="40" y="468" class="name">Private by scope</text>
        <text x="40" y="500" class="body">
          Owner approvals stay in private chat.
        </text>
        <text x="472" y="468" class="name">Explicit sharing</text>
        <text x="472" y="500" class="body">
          Files require publication; no chat mirroring.
        </text>
        <text x="904" y="468" class="name">
          Solid → tasks · dashed → replies
        </text>
        <text x="904" y="500" class="body">
          Offline requests expire; grants are rechecked.
        </text>
      </svg>
    </main>
  </body>
</html>
