<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Permissions follow the execution surface</title>
    <style>
      body {
        margin: 0;
        background: #f5f5f7;
      }
      main {
        max-width: 1280px;
        margin: auto;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1280 760"
        role="img"
        aria-labelledby="artemis-trust-fabric-title artemis-trust-fabric-desc"
      >
        <title id="artemis-trust-fabric-title">
          Permissions follow the execution surface
        </title>
        <desc id="artemis-trust-fabric-desc">
          Mode policy denies writes in Plan and Review before tools run. Shell
          and Terminal use desktop-user permissions, while IM, MCP and
          executable extensions have distinct scoped or trusted boundaries.
        </desc>
        <defs>
          <style>
            text {
              font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              fill: #1d1d1f;
            }
            .title {
              font-size: 34px;
              font-weight: 650;
              letter-spacing: -0.6px;
            }
            .sub {
              font-size: 17px;
              fill: #5a5a60;
            }
            .name {
              font-size: 21px;
              font-weight: 600;
            }
            .body {
              font-size: 16px;
              fill: #5a5a60;
            }
            .tag {
              font-size: 12px;
              letter-spacing: 1.2px;
              fill: #5a5a60;
              font-weight: 600;
            }
            .node {
              fill: #fff;
              stroke: #b9b9be;
              stroke-width: 1.2;
            }
            .focal {
              fill: #e4effb;
              stroke: #0071e3;
              stroke-width: 1.5;
            }
            .zone {
              fill: #ececee;
              fill-opacity: 0.45;
              stroke: #b9b9be;
              stroke-dasharray: 5 5;
            }
            .edge {
              fill: none;
              stroke: #5a5a60;
              stroke-width: 1.6;
              marker-end: url(#artemis-trust-fabric-arrow);
            }
            .network {
              stroke: #0071e3;
              marker-end: url(#artemis-trust-fabric-blue);
            }
            .label {
              font-size: 13px;
              fill: #5a5a60;
            }
            .rule {
              stroke: #c9c9ce;
              stroke-width: 1;
            }
          </style>
          <marker
            id="artemis-trust-fabric-arrow"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <path d="M0 0 8 4 0 8Z" fill="#5a5a60" />
          </marker>
          <marker
            id="artemis-trust-fabric-blue"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <path d="M0 0 8 4 0 8Z" fill="#0071e3" />
          </marker>
        </defs>
        <rect width="1280" height="760" fill="#f5f5f7" />
        <text x="40" y="44" class="tag">ARTEMIS / 1.6.0</text>
        <text x="40" y="92" class="title">
          Permissions follow the execution surface
        </text>
        <text x="40" y="128" class="sub">
          Read-only modes, desktop tools, remote work and extensions have
          separate controls.
        </text>
        <rect x="24" y="176" width="1232" height="464" rx="12" class="zone" />
        <text x="44" y="204" class="tag">
          POLICY IS ENFORCED BEFORE EXECUTION
        </text>
        <path d="M328 284 H456" class="edge" />
        <rect x="349.0" y="249" width="86" height="21" fill="#f5f5f7" />
        <text x="392" y="264" class="label" text-anchor="middle">
          mode check
        </text>
        <path d="M788 252 H920" class="edge" />
        <rect x="814.5" y="217" width="79" height="21" fill="#f5f5f7" />
        <text x="854" y="232" class="label" text-anchor="middle">
          read only
        </text>
        <path
          d="M788 312 H848 Q856 312 856 320 V396 Q856 404 864 404 H920"
          class="edge"
        />
        <path
          d="M622 356 V388 Q622 396 614 396 H216 Q208 396 208 404 V452"
          class="edge"
        />
        <path d="M644 356 V452" class="edge" />
        <rect x="48" y="212" width="280" height="144" rx="8" class="node" />
        <text x="68" y="248" class="name">Requested operation</text>
        <text x="68" y="280" class="body">Agent tool or user action</text>
        <text x="68" y="304" class="body">Project and task context</text>
        <text x="68" y="328" class="body">No implicit authority</text>
        <rect x="456" y="212" width="332" height="144" rx="8" class="focal" />
        <text x="476" y="248" class="name">Mode + surface policy</text>
        <text x="476" y="280" class="body">Plan / Review deny writes</text>
        <text x="476" y="304" class="body">Execute enables eligible tools</text>
        <text x="476" y="328" class="body">
          Authorization remains surface-specific
        </text>
        <rect x="920" y="212" width="312" height="112" rx="8" class="node" />
        <text x="940" y="248" class="name">Plan / Review</text>
        <text x="940" y="280" class="body">No Shell, MCP or extensions</text>
        <rect x="920" y="364" width="312" height="112" rx="8" class="node" />
        <text x="940" y="400" class="name">IM-originated task</text>
        <text x="940" y="432" class="body">
          Project-scoped files and commands
        </text>
        <text x="940" y="456" class="body">Owner grants + native sandbox</text>
        <rect x="48" y="452" width="320" height="148" rx="8" class="node" />
        <text x="68" y="488" class="name">Shell + Terminal</text>
        <text x="68" y="520" class="body">
          Current desktop-user permissions
        </text>
        <text x="68" y="544" class="body">Shell only in Execute</text>
        <text x="68" y="568" class="body">Terminal is opened by the user</text>
        <rect x="456" y="452" width="360" height="148" rx="8" class="node" />
        <text x="476" y="488" class="name">Local stdio MCP</text>
        <text x="476" y="520" class="body">
          AppContainer / Seatbelt by default
        </text>
        <text x="476" y="544" class="body">
          Per-server network and file scope
        </text>
        <text x="476" y="568" class="body">Explicit compatibility opt-in</text>
        <path
          d="M768 356 V412 Q768 420 776 420 H864 Q872 420 872 428 V540 Q872 548 880 548 H920"
          class="edge"
        />
        <rect x="920" y="492" width="312" height="136" rx="8" class="node" />
        <text x="940" y="528" class="name">Executable extensions</text>
        <text x="940" y="560" class="body">Project + content-hash trust</text>
        <text x="940" y="584" class="body">Sandbox by default</text>
        <text x="940" y="608" class="body">
          Extension-only full access opt-in
        </text>
        <path d="M40 684 H1240" class="rule" />
        <text x="40" y="716" class="body">
          The Full local access setting applies only to executable extensions.
        </text>
        <text x="40" y="744" class="label">
          Solid arrows: permitted flow · Dashed arrows: return or optional flow
          · Dashed boxes: local boundary
        </text>
      </svg>
    </main>
  </body>
</html>
