  <path d="M836 222.5 L837.5 226.5 L841.5 228 L837.5 229.5 L836 233.5 L834.5 229.5 L830.5 228 L834.5 226.5 Z" fill="#b88318"/>
  <text x="847" y="232" class="sans" font-size="11.5" font-weight="600" fill="#7d5200">Pi · Single agent loop</text>

