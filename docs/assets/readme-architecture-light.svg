  <text x="407" y="43.5" class="sans stitle">IM Gateway</text>
  <rect x="632" y="30" width="62" height="17" rx="8.5" fill="#f4f4f2" stroke="#dcdcd7"/>
  <text x="663" y="41.5" class="mono pill" fill="#6b6f78" text-anchor="middle">OPTIONAL</text>
  <text x="387" y="65" class="sans sub">Routes remote threads through desktop policy</text>

  <rect x="808" y="18" width="232" height="62" rx="10" fill="#ffffff" stroke="#c8c8c3" stroke-dasharray="4 3.5"/>
  <g transform="translate(822, 34)" fill="none" stroke="#6b6f78" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 1.5 L8.3 5.2 L12 6.5 L8.3 7.8 L7 11.5 L5.7 7.8 L2 6.5 L5.7 5.2 Z"/>
  </g>
  <text x="841" y="43.5" class="sans stitle">Model Providers</text>
  <rect x="968" y="30" width="58" height="17" rx="8.5" fill="#f4f4f2" stroke="#dcdcd7"/>
  <text x="997" y="41.5" class="mono pill" fill="#6b6f78" text-anchor="middle">EXTERNAL</text>
  <text x="822" y="65" class="sans sub">Pi catalog · Responses · Chat</text>

  <!-- Artemis Desktop Local-First Frame -->
  <rect x="24" y="114" width="1032" height="442" rx="14" fill="#f4f4f2" stroke="#dcdcd7"/>
  <rect x="25" y="115" width="1030" height="440" rx="13" fill="url(#dots)"/>

  <g transform="translate(40, 126)">
