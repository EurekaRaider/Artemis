    <path d="M5.5 1 L9.8 2.8 V6.2 C9.8 9 7.8 10.9 5.5 11.8 C3.2 10.9 1.2 9 1.2 6.2 V2.8 Z"/>
  </g>
  <text x="417" y="272" class="mono key" fill="#7d5200">broker/</text>
  <text x="682" y="272" class="sans sub" fill="#785b22" text-anchor="end">Plan / Work / Code · Approvals</text>

  <rect x="386" y="292" width="308" height="32" rx="7" fill="#f7f7f5" stroke="#e8e8e4"/>
  <text x="398" y="312" class="mono key">services</text>
  <text x="682" y="312" class="sans sub" text-anchor="end">Git · Worktrees · PTY · MCP · IM</text>

