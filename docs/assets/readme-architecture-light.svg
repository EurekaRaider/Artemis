  <g transform="translate(54, 34)" fill="none" stroke="#6b6f78" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.5 3.5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2H6l-2.8 2V10h-.7a2 2 0 0 1-1-1.7z"/>
  </g>
  <text x="73" y="43.5" class="sans stitle">IM Channels</text>
  <rect x="200" y="30" width="58" height="17" rx="8.5" fill="#f4f4f2" stroke="#dcdcd7"/>
  <text x="229" y="41.5" class="mono pill" fill="#6b6f78" text-anchor="middle">EXTERNAL</text>
  <text x="54" y="65" class="sans sub">Feishu / Lark · Slack · WeCom</text>

  <circle cx="276" cy="49" r="2.3" fill="#969aa3"/>
  <path d="M 278 49 H 366" fill="none" stroke="#969aa3" stroke-width="1.4" marker-end="url(#arr-ext)"/>

  <rect x="372" y="18" width="336" height="62" rx="10" fill="#ffffff" stroke="#d4d4cf"/>
  <g transform="translate(387, 34)" fill="none" stroke="#5c606a" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="3" cy="6.5" r="1.8"/>
    <circle cx="11" cy="3" r="1.8"/>
    <circle cx="11" cy="10" r="1.8"/>
