  <rect x="54" y="212" width="204" height="32" rx="7" fill="#f7f7f5" stroke="#e8e8e4"/>
  <text x="66" y="232" class="sans row">Views &amp; controllers</text>

  <rect x="54" y="252" width="204" height="32" rx="7" fill="#f7f7f5" stroke="#e8e8e4"/>
  <text x="66" y="272" class="sans row">Protocol reducers</text>
