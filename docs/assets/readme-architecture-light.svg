<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="604" viewBox="0 0 1080 604" role="img" aria-labelledby="title desc">
  <title id="title">Artemis desktop architecture</title>
  <desc id="desc">Artemis local-first desktop architecture showing external IM channels and Model Providers, an optional IM Gateway, and three isolated local OS processes (Sandboxed React Renderer, Electron Main control plane with SQLite and OS safeStorage, and Pi Agent Host utility process with PiAdapter and Child Agents) routing through brokered policy to Web Sandbox, Native OS Sandbox, and Desktop-User execution surfaces.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#16171a" fill-opacity="0.065"/>
    </pattern>
    <linearGradient id="pi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f9edd0"/>
    </linearGradient>
    <linearGradient id="logo-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfb150"/>
      <stop offset="100%" stop-color="#b57d14"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1.5 1.8 L8 5 L1.5 8.2" fill="none" stroke="#7c8089" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-ext" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1.5 1.8 L8 5 L1.5 8.2" fill="none" stroke="#969aa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1.5 1.8 L8 5 L1.5 8.2" fill="none" stroke="#b88318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { font-size: 9.5px; font-weight: 600; letter-spacing: 1.1px; fill: #6b6f78; }
      .title { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; fill: #16171a; }
      .stitle { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; fill: #16171a; }
      .row { font-size: 11.5px; font-weight: 500; fill: #16171a; }
      .key { font-size: 11px; font-weight: 600; fill: #16171a; }
      .sub { font-size: 11px; fill: #5c606a; }
      .meta { font-size: 10.5px; fill: #6b6f78; }
      .edge { font-size: 10.5px; font-weight: 500; fill: #5c606a; }
      .pill { font-size: 8.8px; font-weight: 600; letter-spacing: 0.75px; }
      .chip { font-size: 12px; font-weight: 600; fill: #16171a; }
      .chip-sub { font-size: 10.5px; fill: #5c606a; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1079" height="603" rx="16" fill="#fafaf9" stroke="#e4e4e2"/>

