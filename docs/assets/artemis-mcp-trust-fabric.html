<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>From MCP discovery to controlled tools</title>
    <style>
      body {
        margin: 0;
        background: #f5f5f7;
      }
      main {
        max-width: 1280px;
        margin: auto;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1280 760"
        role="img"
        aria-labelledby="artemis-mcp-trust-fabric-title artemis-mcp-trust-fabric-desc"
      >
        <title id="artemis-mcp-trust-fabric-title">
          From MCP discovery to controlled tools
        </title>
        <desc id="artemis-mcp-trust-fabric-desc">
          Registry discovery feeds validated server configuration. The MCP
          manager applies local stdio sandbox policy or remote transport
          authentication before exposing tools to an Execute task.
        </desc>
        <defs>
          <style>
            text {
              font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              fill: #1d1d1f;
            }
            .title {
              font-size: 34px;
              font-weight: 650;
              letter-spacing: -0.6px;
            }
            .sub {
              font-size: 17px;
              fill: #5a5a60;
            }
            .name {
              font-size: 21px;
              font-weight: 600;
            }
            .body {
              font-size: 16px;
              fill: #5a5a60;
            }
            .tag {
              font-size: 12px;
              letter-spacing: 1.2px;
              fill: #5a5a60;
              font-weight: 600;
            }
            .node {
              fill: #fff;
              stroke: #b9b9be;
              stroke-width: 1.2;
            }
            .focal {
              fill: #e4effb;
              stroke: #0071e3;
              stroke-width: 1.5;
            }
            .zone {
              fill: #ececee;
              fill-opacity: 0.45;
              stroke: #b9b9be;
              stroke-dasharray: 5 5;
            }
            .edge {
              fill: none;
              stroke: #5a5a60;
              stroke-width: 1.6;
              marker-end: url(#artemis-mcp-trust-fabric-arrow);
            }
            .network {
              stroke: #0071e3;
              marker-end: url(#artemis-mcp-trust-fabric-blue);
            }
            .label {
              font-size: 13px;
              fill: #5a5a60;
            }
            .rule {
              stroke: #c9c9ce;
              stroke-width: 1;
            }
          </style>
          <marker
            id="artemis-mcp-trust-fabric-arrow"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <path d="M0 0 8 4 0 8Z" fill="#5a5a60" />
          </marker>
          <marker
            id="artemis-mcp-trust-fabric-blue"
            markerWidth="8"
            markerHeight="8"
            refX="8"
            refY="4"
            orient="auto"
          >
            <path d="M0 0 8 4 0 8Z" fill="#0071e3" />
          </marker>
        </defs>
        <rect width="1280" height="760" fill="#f5f5f7" />
        <text x="40" y="44" class="tag">ARTEMIS / 1.6.0</text>
        <text x="40" y="92" class="title">
          From MCP discovery to controlled tools
        </text>
        <text x="40" y="128" class="sub">
          Registry metadata, connection configuration and execution are separate
          steps.
        </text>
        <rect x="24" y="352" width="804" height="288" rx="12" class="zone" />
        <text x="44" y="380" class="tag">
          LOCAL MCP RUNTIME / PER-SERVER CONTROLS
        </text>
        <path d="M328 268 H456" class="edge" />
        <rect x="356.0" y="233" width="72" height="21" fill="#f5f5f7" />
        <text x="392" y="248" class="label" text-anchor="middle">metadata</text>
        <path d="M784 268 H920" class="edge" />
        <rect x="795.0" y="233" width="114" height="21" fill="#f5f5f7" />
        <text x="852" y="248" class="label" text-anchor="middle">
          save + connect
        </text>
        <path
          d="M1080 316 V372 Q1080 380 1072 380 H644 Q636 380 636 388 V424"
          class="edge"
        />
        <path d="M472 500 H360" class="edge" />
        <path d="M800 500 H920" class="edge" />
        <rect x="48" y="200" width="280" height="116" rx="8" class="node" />
        <text x="68" y="236" class="name">Registry discovery</text>
        <text x="68" y="268" class="body">Public metadata and packages</text>
        <text x="68" y="292" class="body">
          Discovery is not execution trust
        </text>
        <rect x="456" y="200" width="328" height="116" rx="8" class="focal" />
        <text x="476" y="236" class="name">Validated configuration</text>
        <text x="476" y="268" class="body">Installation path + transport</text>
        <text x="476" y="292" class="body">
          Explicit server settings and auth
        </text>
        <rect x="920" y="200" width="312" height="116" rx="8" class="node" />
        <text x="940" y="236" class="name">Agent tool exposure</text>
        <text x="940" y="268" class="body">Execute mode only</text>
        <text x="940" y="292" class="body">Model approval still applies</text>
        <rect x="48" y="424" width="312" height="164" rx="8" class="node" />
        <text x="68" y="460" class="name">Local stdio server</text>
        <text x="68" y="492" class="body">Seatbelt / AppContainer default</text>
        <text x="68" y="516" class="body">
          Workspace + private runtime files
        </text>
        <text x="68" y="540" class="body">Minimal forwarded environment</text>
        <text x="68" y="564" class="body">Per-server network switch</text>
        <rect x="472" y="424" width="328" height="164" rx="8" class="focal" />
        <text x="492" y="460" class="name">MCP client manager</text>
        <text x="492" y="492" class="body">Start, connect and stop safely</text>
        <text x="492" y="516" class="body">Apply per-server policy</text>
        <text x="492" y="540" class="body">Normalize results for Artemis</text>
        <text x="492" y="564" class="body">No renderer Node access</text>
        <rect x="920" y="424" width="312" height="164" rx="8" class="node" />
        <text x="940" y="460" class="name">Remote MCP server</text>
        <text x="940" y="492" class="body">Authenticated HTTP transport</text>
        <text x="940" y="516" class="body">Provider-held remote execution</text>
        <text x="940" y="540" class="body">No local sandbox implication</text>
        <text x="940" y="564" class="body">
          Remote service trust is separate
        </text>
        <path d="M40 684 H1240" class="rule" />
        <text x="40" y="716" class="body">
          A trusted local server may explicitly opt into desktop-user
          compatibility mode.
        </text>
        <text x="40" y="744" class="label">
          Solid arrows: permitted flow · Dashed arrows: return or optional flow
          · Dashed boxes: local boundary
        </text>
      </svg>
    </main>
  </body>
</html>
