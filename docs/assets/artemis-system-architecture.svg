<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" role="img" aria-labelledby="artemis-system-architecture-title artemis-system-architecture-desc" id="artemis-system-architecture-root"><title id="artemis-system-architecture-title">Artemis runtime and service boundaries</title><desc id="artemis-system-architecture-desc">Typed IPC connects the renderer, main services and Pi agent host; plugin isolation, paged persistence and verified platform updates have separate contracts.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #artemis-system-architecture-root text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1d1d1f }
      #artemis-system-architecture-root .body { font-size:17px;fill:#5a5a60 }
      #artemis-system-architecture-root .name { font-size:23px;font-weight:600 }
      #artemis-system-architecture-root .edge { fill:none;stroke:#5a5a60;stroke-width:1.6;marker-end:url(#artemis-system-architecture-artemis-system-architecture-arrow) }</style><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1d1d1f}.body{font-size:17px;fill:#5a5a60}.name{font-size:23px;font-weight:600}.edge{fill:none;stroke:#5a5a60;stroke-width:1.6;marker-end:url(#artemis-system-architecture-artemis-system-architecture-arrow)}</style><marker id="artemis-system-architecture-artemis-system-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5a5a60"/></marker></defs><rect width="1280" height="840" fill="#f5f5f7"/><text x="40" y="44" class="body">ARTEMIS / OPEN SOURCE · WINDOWS X64 + MACOS ARM64</text><text x="40" y="96" font-size="36" font-weight="650">One agent loop, explicit service boundaries</text><text x="40" y="136" class="body">Host policy owns execution. Plugin contracts and renderer state remain independent of Pi internals.</text><path d="M400 284H460" class="edge"/><path d="M820 284H880" class="edge"/><path d="M640 368V440" class="edge"/><path d="M220 440V400Q220 392 228 392H444Q452 392 452 384V340H460" class="edge"/><path d="M820 340H848Q856 340 856 348V384Q856 392 864 392H1052Q1060 392 1060 400V440" class="edge"/><rect x="40" y="200" width="360" height="168" rx="8" fill="#fff" stroke="#b9b9be"/><text x="60" y="240" class="name">Renderer</text><text x="60" y="276" class="body">Typed preload API; no Node</text><text x="60" y="304" class="body">Shared visibility scheduling</text><text x="60" y="332" class="body">Bounded derived-session cache</text><rect x="460" y="200" width="360" height="168" rx="8" fill="#e4effb" stroke="#0071e3"/><text x="480" y="240" class="name">Electron Main</text><text x="480" y="276" class="body">IPC validation + lifecycle</text><text x="480" y="304" class="body">Plugin, session, update services</text><text x="480" y="332" class="body">No activation or device binding</text><rect x="880" y="200" width="360" height="168" rx="8" fill="#fff" stroke="#b9b9be"/><text x="900" y="240" class="name">Pi Agent Host</text><text x="900" y="276" class="body">One agent loop in utility process</text><text x="900" y="304" class="body">PiAdapter → versioned events</text><text x="900" y="332" class="body">Model providers + normalized usage</text><rect x="40" y="440" width="360" height="168" rx="8" fill="#fff" stroke="#b9b9be"/><text x="60" y="480" class="name">Plugin boundary</text><text x="60" y="516" class="body">Pure contract + runtime SDK</text><text x="60" y="544" class="body">v1 adapters; v2 resource / interactive</text><text x="60" y="572" class="body">Content trust + frozen task binding</text><rect x="460" y="440" width="360" height="168" rx="8" fill="#fff" stroke="#b9b9be"/><text x="480" y="480" class="name">Persistence</text><text x="480" y="516" class="body">SQLite WAL + event projections</text><text x="480" y="544" class="body">Worker-owned history pages</text><text x="480" y="572" class="body">Pi JSONL remains model history</text><rect x="880" y="440" width="360" height="168" rx="8" fill="#fff" stroke="#b9b9be"/><text x="900" y="480" class="name">Release and updates</text><text x="900" y="516" class="body">Windows NSIS + manual ZIP</text><text x="900" y="544" class="body">macOS arm64 DMG + ZIP</text><text x="900" y="572" class="body">Hosted CI; explicit artifact allowlist</text><path d="M40 660H1240" stroke="#b9b9be"/><text x="40" y="704" class="body">Interactive runtime: Seatbelt / AppContainer · read-only plugin files · task scratch writes · no network</text><text x="40" y="740" class="body">Installed Windows updates: signed index → verified installers + DB snapshot → external recovery helper</text><text x="40" y="784" class="body">Main and renderer retain feature coordination; extracted modules own their state and validation.</text></svg>
