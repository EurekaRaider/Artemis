      const localeMetadata = {"en":{"name":"English","direction":"ltr","openGraph":"en_US"},"zh-CN":{"name":"简体中文","direction":"ltr","openGraph":"zh_CN"},"zh-TW":{"name":"繁體中文","direction":"ltr","openGraph":"zh_TW"},"ja":{"name":"日本語","direction":"ltr","openGraph":"ja_JP"},"ko":{"name":"한국어","direction":"ltr","openGraph":"ko_KR"},"es":{"name":"Español","direction":"ltr","openGraph":"es_ES"},"fr":{"name":"Français","direction":"ltr","openGraph":"fr_FR"},"de":{"name":"Deutsch","direction":"ltr","openGraph":"de_DE"},"pt-BR":{"name":"Português (Brasil)","direction":"ltr","openGraph":"pt_BR"},"it":{"name":"Italiano","direction":"ltr","openGraph":"it_IT"},"ru":{"name":"Русский","direction":"ltr","openGraph":"ru_RU"},"ar":{"name":"العربية","direction":"rtl","openGraph":"ar_SA"},"hi":{"name":"हिन्दी","direction":"ltr","openGraph":"hi_IN"},"id":{"name":"Bahasa Indonesia","direction":"ltr","openGraph":"id_ID"}};
      const locales = ["en","zh-CN","zh-TW","ja","ko","es","fr","de","pt-BR","it","ru","ar","hi","id"];
      const isLocale = function isLocale(value) {
    return Object.hasOwn(localeMetadata, value);
};
      const resolveLocale = function resolveLocale(preferred) {
    for (const value of preferred) {
        const language = value.trim().replaceAll('_', '-').toLowerCase();
        const exact = locales.find((locale) => locale.toLowerCase() === language);
        if (exact)
            return exact;
        if (/^zh(?:-|$)/.test(language)) {
            return /(?:^|-)(?:hant|tw|hk|mo)(?:-|$)/.test(language) ? 'zh-TW' : 'zh-CN';
        }
        const base = language.split('-')[0];
        if (base === 'pt')
            return 'pt-BR';
        if (base === 'in')
            return 'id';
        if (isLocale(base))
            return base;
    }
    return 'en';
};
      const locale = resolveLocale(navigator.languages || [navigator.language]);
      window.location.replace("" + '/' + locale + '/');
    </script>
