<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
    <title>Artemis</title>
    <link rel="icon" href="/favicon.svg">
    <style>body{margin:0;background:#fff;color:#1d1d1f;font-family:system-ui,sans-serif}main{max-width:640px;margin:15vh auto;padding:32px;text-align:center}h1{font-size:48px;letter-spacing:-.05em}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px}a{padding:12px 0;color:#626267;text-decoration:none}a:hover,a:focus-visible{color:#326fc5;text-decoration:underline}</style>
    <script>
      const localeMetadata = {"en":{"name":"English","direction":"ltr","openGraph":"en_US"},"zh-CN":{"name":"简体中文","direction":"ltr","openGraph":"zh_CN"},"zh-TW":{"name":"繁體中文","direction":"ltr","openGraph":"zh_TW"},"ja":{"name":"日本語","direction":"ltr","openGraph":"ja_JP"},"ko":{"name":"한국어","direction":"ltr","openGraph":"ko_KR"},"es":{"name":"Español","direction":"ltr","openGraph":"es_ES"},"fr":{"name":"Français","direction":"ltr","openGraph":"fr_FR"},"de":{"name":"Deutsch","direction":"ltr","openGraph":"de_DE"},"pt-BR":{"name":"Português (Brasil)","direction":"ltr","openGraph":"pt_BR"},"it":{"name":"Italiano","direction":"ltr","openGraph":"it_IT"},"ru":{"name":"Русский","direction":"ltr","openGraph":"ru_RU"},"ar":{"name":"العربية","direction":"rtl","openGraph":"ar_SA"},"hi":{"name":"हिन्दी","direction":"ltr","openGraph":"hi_IN"},"id":{"name":"Bahasa Indonesia","direction":"ltr","openGraph":"id_ID"}};
      const locales = ["en","zh-CN","zh-TW","ja","ko","es","fr","de","pt-BR","it","ru","ar","hi","id"];
      const isLocale = function isLocale(value) {
    return Object.hasOwn(localeMetadata, value);
};
      const resolveLocale = function resolveLocale(preferred) {
    for (const value of preferred) {
        const language = value.trim().replaceAll('_', '-').toLowerCase();
        const exact = locales.find((locale) => locale.toLowerCase() === language);
        if (exact)
            return exact;
        if (/^zh(?:-|$)/.test(language)) {
            return /(?:^|-)(?:hant|tw|hk|mo)(?:-|$)/.test(language) ? 'zh-TW' : 'zh-CN';
        }
        const base = language.split('-')[0];
        if (base === 'pt')
            return 'pt-BR';
        if (base === 'in')
            return 'id';
        if (isLocale(base))
            return base;
    }
    return 'en';
};
      const languagePreferenceKey = "artemis-language-v1";
      const savedLocale = function savedLocale() {
    try {
        const value = localStorage.getItem(languagePreferenceKey);
        return value && isLocale(value) ? value : undefined;
    }
    catch {
        return undefined;
    }
};
      const rememberLocale = function rememberLocale(locale) {
    try {
        localStorage.setItem(languagePreferenceKey, locale);
    }
    catch {
        // Navigation still works when browser storage is unavailable.
    }
};
      const detectVisitorLocale = function detectVisitorLocale(preferred) {
    return savedLocale() ?? resolveLocale(preferred);
};
      const locale = detectVisitorLocale(navigator.languages || [navigator.language]);
      window.location.replace("" + '/' + locale + '/' + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <main><h1>Artemis</h1><nav><a lang="en" dir="ltr" href="/en/" onclick="rememberLocale('en')">English</a><a lang="zh-CN" dir="ltr" href="/zh-CN/" onclick="rememberLocale('zh-CN')">简体中文</a><a lang="zh-TW" dir="ltr" href="/zh-TW/" onclick="rememberLocale('zh-TW')">繁體中文</a><a lang="ja" dir="ltr" href="/ja/" onclick="rememberLocale('ja')">日本語</a><a lang="ko" dir="ltr" href="/ko/" onclick="rememberLocale('ko')">한국어</a><a lang="es" dir="ltr" href="/es/" onclick="rememberLocale('es')">Español</a><a lang="fr" dir="ltr" href="/fr/" onclick="rememberLocale('fr')">Français</a><a lang="de" dir="ltr" href="/de/" onclick="rememberLocale('de')">Deutsch</a><a lang="pt-BR" dir="ltr" href="/pt-BR/" onclick="rememberLocale('pt-BR')">Português (Brasil)</a><a lang="it" dir="ltr" href="/it/" onclick="rememberLocale('it')">Italiano</a><a lang="ru" dir="ltr" href="/ru/" onclick="rememberLocale('ru')">Русский</a><a lang="ar" dir="rtl" href="/ar/" onclick="rememberLocale('ar')">العربية</a><a lang="hi" dir="ltr" href="/hi/" onclick="rememberLocale('hi')">हिन्दी</a><a lang="id" dir="ltr" href="/id/" onclick="rememberLocale('id')">Bahasa Indonesia</a></nav></main>
  </body>
</html>
